<!DOCTYPE html>
<html lang="zh-Hant" class="sl-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCORE LAB · 樂譜與簡譜識別</title>
  <script type="module" src="/src/scorelab-omr.ts"></script>
  <style>
    :root {
      --bg: #050507;
      --surface: #0c0e13;
      --surface-2: #131620;
      --line: #1f2433;
      --line-hi: #32394f;
      --text: #f3f5f8;
      --muted: #68738c;
      --mint: #00e89d;
      --mint-bg: rgba(0, 232, 157, 0.12);
      --amber: #ffb020;
      --amber-bg: rgba(255, 176, 32, 0.14);
      --coral: #ff3b5c;
      --coral-bg: rgba(255, 59, 92, 0.14);
      --cyan: #38bdf8;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    #sl-app, #sl-app * { box-sizing: border-box; }

    html.sl-html, body.sl-body {
      margin: 0;
      height: auto;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    body.sl-body { padding: 14px 10px 72px; }

    #sl-app.sl-app { max-width: 1120px; margin: 0 auto; }

    /* Topbar */
    #sl-app .topbar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; padding-bottom: 12px;
      border-bottom: 1px solid var(--line); margin-bottom: 12px;
    }
    #sl-app .brand { display: flex; align-items: center; gap: 8px; }
    #sl-app .brand-sq { width: 10px; height: 10px; background: var(--mint); }
    #sl-app .brand h1 { margin: 0; font-size: 0.9rem; letter-spacing: 0.22em; font-weight: 800; color: var(--text); }
    #sl-app .mono-tag { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border: 1px solid var(--line); padding: 2px 7px; }

    #sl-app .tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); padding: 3px; }
    #sl-app .tab-btn { border: none; background: transparent; color: var(--muted); padding: 6px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    #sl-app .tab-btn.active { background: var(--text); color: var(--bg); }

    /* Panels & Controls */
    #sl-app .panel { background: var(--surface); border: 1px solid var(--line); padding: 12px; margin-bottom: 10px; }
    #sl-app .row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    #sl-app .between { justify-content: space-between; }

    #sl-app .ctrl-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--surface-2); border: 1px solid var(--line);
      padding: 4px 9px; font-family: var(--mono); font-size: 0.76rem;
    }
    #sl-app input[type="range"] { width: 70px; accent-color: var(--mint); cursor: pointer; }
    #sl-app select { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); padding: 5px 8px; font-size: 0.76rem; font-weight: 700; outline: none; cursor: pointer; }

    #sl-app .toggle {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface-2); border: 1px solid var(--line);
      padding: 5px 9px; font-size: 0.74rem; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none;
    }
    #sl-app .toggle input { display: none; }
    #sl-app .toggle .dot { width: 6px; height: 6px; background: #333a4d; }
    #sl-app .toggle.on { color: var(--text); border-color: var(--line-hi); }
    #sl-app .toggle.on .dot { background: var(--mint); box-shadow: 0 0 8px var(--mint); }

    #sl-app .btn {
      border: 1px solid var(--line-hi); background: var(--surface-2); color: var(--text);
      padding: 6px 11px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 0;
    }
    #sl-app .btn:hover:not(:disabled) { border-color: var(--text); }
    #sl-app .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #sl-app .btn.active { background: var(--mint); color: #04120c; border-color: var(--mint); }
    #sl-app .btn-mint { background: var(--mint); color: #04120c; border-color: var(--mint); }
    #sl-app .btn-xs { padding: 4px 8px; font-size: 0.7rem; }

    /* 純 SVG 圖示按鈕（我的最愛等） */
    #sl-app .btn-icon {
      padding: 5px 7px;
      min-width: 28px;
      min-height: 26px;
      line-height: 1;
    }
    #sl-app .btn-icon svg {
      width: 15px;
      height: 15px;
      display: block;
    }
    #sl-app .btn-icon.fav-saved {
      border-color: var(--coral);
      color: var(--coral);
      background: var(--coral-bg);
    }
    #sl-app .btn-icon.fav-open {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-bg);
    }

    #sl-app .playback-icon { display: inline-flex; align-items: center; width: 10px; height: 10px; }
    #sl-app .playback-icon svg { width: 10px; height: 10px; display: block; }

    #sl-app .cat-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    #sl-app .cat-pill { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 3px 9px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
    #sl-app .cat-pill.active { border-color: var(--mint); color: var(--mint); background: var(--mint-bg); }

    /* Beat Matrix */
    #sl-app .beat-strip { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
    #sl-app .beat-status { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 60px; text-align: right; }
    #sl-app .leds { display: flex; gap: 5px; }
    #sl-app .led { width: 24px; height: 3px; background: var(--surface-2); border: 1px solid var(--line); }
    #sl-app .led.countin { background: var(--amber); border-color: var(--amber); }
    #sl-app .led.playing { background: var(--mint); border-color: var(--mint); }

    /* Quiz / Library */
    #sl-app .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (max-width: 680px) { #sl-app .grid-2 { grid-template-columns: 1fr; } }

    #sl-app .pad {
      position: relative; background: var(--surface-2); border: 1px solid var(--line);
      padding: 18px 10px 12px; min-height: 96px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; overflow-x: auto;
    }
    #sl-app .pad:hover:not(.locked) { border-color: var(--text); }
    #sl-app .pad.correct { border-color: var(--mint); background: var(--mint-bg); }
    #sl-app .pad.wrong { border-color: var(--coral); background: var(--coral-bg); }
    #sl-app .pad.dimmed { opacity: 0.4; }
    #sl-app .pad-idx { position: absolute; top: 6px; left: 8px; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
    #sl-app .pad-meta { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 0.74rem; color: var(--muted); font-weight: 700; }

    #sl-app .result-strip {
      margin-top: 10px; padding: 8px 12px; display: none;
      align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 700; border: 1px solid transparent;
    }
    #sl-app .result-strip.show { display: flex; }
    #sl-app .result-strip.ok { background: var(--mint-bg); border-color: var(--mint); color: var(--mint); }
    #sl-app .result-strip.err { background: var(--coral-bg); border-color: var(--coral); color: var(--coral); }

    #sl-app .lib-card { background: var(--surface-2); border: 1px solid var(--line); padding: 9px 11px; cursor: pointer; overflow-x: auto; }
    #sl-app .playing-card { border-color: var(--mint) !important; box-shadow: inset 0 0 0 1px var(--mint); }
    #sl-app .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 2px; }
    #sl-app .tag { font-family: var(--mono); font-size: 0.64rem; padding: 1px 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
    #sl-app .tag-sync { color: var(--amber); border-color: rgba(255,176,32,0.45); }
    #sl-app .tag-dot { color: var(--cyan); border-color: rgba(56,189,248,0.45); }
    #sl-app .tag-16 { color: #c084fc; border-color: rgba(192,132,252,0.45); }
    #sl-app .tag-off { color: var(--coral); border-color: rgba(255,59,92,0.45); }

    #sl-app .dropzone {
      border: 1px dashed var(--line-hi); padding: 18px 12px; text-align: center;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    #sl-app .dropzone:hover, #sl-app .dropzone.dragover { border-color: var(--mint); background: var(--mint-bg); }
    #sl-app .omr-status-bar {
      margin-top: 8px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--line-hi);
      font-family: var(--mono); font-size: 0.74rem; color: var(--cyan); display: flex; justify-content: space-between; align-items: center;
    }
    #sl-app .omr-status-bar.err { color: var(--coral); border-color: var(--coral); background: var(--coral-bg); }
    #sl-app .omr-status-bar.ok { color: var(--mint); border-color: var(--mint); background: var(--mint-bg); }

    /* 多頁順序確認面板 */
    #sl-app .queue-panel {
      margin-top: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--amber);
    }
    #sl-app .queue-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; margin: 10px 0;
    }
    #sl-app .queue-item {
      background: var(--surface); border: 1px solid var(--line-hi); padding: 6px;
      display: flex; flex-direction: column; gap: 6px; cursor: grab; user-select: none;
    }
    #sl-app .queue-item.dragging { opacity: 0.4; border-color: var(--mint); }
    #sl-app .queue-thumb {
      width: 100%; height: 140px; object-fit: contain; background: #fff; display: block;
    }
    #sl-app .queue-foot {
      display: flex; justify-content: space-between; align-items: center; gap: 4px;
    }

    /* 我的最愛清單面板 */
    #sl-app .fav-panel {
      margin-top: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line-hi);
    }
    #sl-app .fav-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 8px;
    }
    #sl-app .fav-card {
      background: var(--surface); border: 1px solid var(--line); padding: 9px 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer;
    }
    #sl-app .fav-card:hover { border-color: var(--mint); }
    #sl-app .fav-card.current { border-color: var(--mint); background: var(--mint-bg); }
    #sl-app .fav-info { min-width: 0; flex: 1; }
    #sl-app .fav-title { font-size: 0.8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sl-app .fav-sub { font-family: var(--mono); font-size: 0.66rem; color: var(--muted); margin-top: 3px; }

    /* Dolce 官方譜面外框 */
    #sl-app .score-toolbar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 8px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--line);
      margin-bottom: 10px;
    }
    #sl-app .sl-score-box {
      height: 76vh; display: flex; flex-direction: column;
      border: 1px solid var(--line); background: #141720; overflow: hidden;
    }
    #sl-app #score-pane {
      flex: 1; min-height: 0; overflow: auto; padding: 16px; background: #141720;
    }

    /* JIANPU NOTATION (測驗與圖鑑用) */
    #sl-app .jianpu-bar {
      display: inline-flex; align-items: center; flex-wrap: nowrap; gap: 12px;
      font-family: "Times New Roman", "Noto Serif TC", Georgia, serif;
      font-size: 21px; font-weight: 700; color: var(--text);
      padding: 26px 5px 34px; user-select: none;
    }
    #sl-app .jianpu-bar::before, #sl-app .jianpu-bar::after {
      content: ""; display: inline-block; width: 2px; height: 17px; background: var(--line-hi); align-self: center; flex-shrink: 0;
    }
    #sl-app .j-group-tight { display: inline-flex; align-items: center; gap: 4px; }
    #sl-app .u1 { display: inline-flex; align-items: center; gap: 5px; border-bottom: 2px solid #cbd5e1; padding-bottom: 2px; }
    #sl-app .u2-inner { display: inline-flex; align-items: center; gap: 4px; border-bottom: 2px solid #cbd5e1; padding-bottom: 2px; }
    #sl-app .j-ev { position: relative; display: inline-flex; align-items: center; line-height: 1.05; transition: color 0.05s, transform 0.05s; }
    #sl-app .j-ev.j-rest { color: var(--muted); }
    #sl-app .j-ev.active-note { color: #ffffff !important; text-shadow: 0 0 12px var(--mint), 0 0 4px #fff; transform: translateY(-2px) scale(1.18); }
    #sl-app .j-dash { font-family: system-ui, sans-serif; font-weight: 700; margin-left: 3px; color: var(--muted); font-size: 0.88em; }
    #sl-app .j-dot { font-weight: 900; margin-left: 1px; }
    #sl-app .triplet { position: relative; display: inline-flex; align-items: center; }
    #sl-app .triplet::before { content: "3"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--cyan); line-height: 1; }
    #sl-app .triplet::after { content: ""; position: absolute; top: -7px; left: 1px; right: 1px; height: 4px; border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan); pointer-events: none; }

    #sl-app .hidden { display: none !important; }
  </style>
</head>
<body class="sl-body">
  <div id="sl-app" class="sl-app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-sq"></span>
        <h1>SCORE LAB</h1>
      </div>

      <div class="row">
        <!-- 純 SVG 我的最愛清單按鍵 -->
        <button class="btn btn-icon" id="myBtnFavList" type="button" title="我的最愛" aria-label="我的最愛">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            <path d="M12 13.5l-2.6-2.4a1.6 1.6 0 0 1 2.2-2.3L12 9.2l.4-.4a1.6 1.6 0 0 1 2.2 2.3L12 13.5z" fill="currentColor" stroke="none"/>
          </svg>
        </button>

        <nav class="tabs">
          <button class="tab-btn active" data-tab="analyzer">樂譜</button>
          <button class="tab-btn" data-tab="quiz">測驗</button>
          <button class="tab-btn" data-tab="library">圖鑑</button>
        </nav>
      </div>
    </header>

    <!-- 測驗 / 圖鑑專用 Transport -->
    <section id="transportPanel" class="panel hidden">
      <div class="row between">
        <div class="row">
          <div class="ctrl-pill">
            <span id="bpmVal" style="color:var(--mint); font-weight:800;">92</span>
            <span>BPM</span>
            <input type="range" id="bpmRange" min="45" max="180" value="92" />
          </div>
          <select id="soundSelect">
            <option value="pluck">鋼琴</option>
            <option value="synth">合成器</option>
            <option value="wood">木魚</option>
          </select>
          <select id="symbolSelect">
            <option value="1">數字 1</option>
            <option value="X">節奏 X</option>
          </select>
        </div>

        <div class="row">
          <label class="toggle on"><input type="checkbox" id="chkCountIn" checked /><span class="dot"></span>預拍</label>
          <label class="toggle on"><input type="checkbox" id="chkMetro" checked /><span class="dot"></span>節拍</label>
        </div>
      </div>
      <div class="cat-row" id="catBar"></div>
    </section>

    <!-- 測驗 / 圖鑑 Beat LEDs -->
    <div id="beatStrip" class="beat-strip hidden">
      <span class="beat-status" id="beatStatus">READY</span>
      <div class="leds" id="beatDots">
        <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
      </div>
    </div>

    <!-- 1. 樂譜區 -->
    <section id="analyzerSection" class="panel">
      <div class="dropzone" id="dropzone">
        <div style="font-weight:800; font-size:0.88rem; letter-spacing:0.1em;">↑ 匯入樂譜（支援複選多張圖片或樂譜檔案）</div>
        <div class="row">
          <select id="omrKindSelect" title="圖片/PDF 辨識模式">
            <option value="auto">自動判別 (五線譜 / 簡譜)</option>
            <option value="staff">強制辨識為：五線譜</option>
            <option value="jianpu">強制辨識為：簡譜</option>
          </select>
          <button class="btn btn-mint btn-xs" id="btnPickFile" type="button">選擇檔案</button>
          <button class="btn btn-xs" id="btnLoadDemo" type="button">載入範例</button>
        </div>
        <input type="file" id="scoreInput" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xml,.musicxml,.abc,.123,.jcx,.jly,.jpwabc,.txt,.mid,.midi" class="hidden" />
      </div>

      <!-- 多張圖片先後順序確認面板 -->
      <div id="multiQueuePanel" class="queue-panel hidden">
        <div class="row between">
          <span style="font-size:0.8rem; font-weight:800; color:var(--amber);">請確認各頁圖片的先後次序（可拖曳或點 ↑ ↓ 調整）</span>
          <div class="row">
            <button class="btn btn-mint btn-xs" id="btnConfirmOrder" type="button">▶ 確認順序並開始辨識</button>
            <button class="btn btn-xs" id="btnCancelOrder" type="button">取消</button>
          </div>
        </div>
        <div class="queue-grid" id="multiQueueGrid"></div>
      </div>

      <!-- 我的最愛抽屜面板 -->
      <div id="favPanel" class="fav-panel hidden">
        <div class="row between">
          <span class="mono-tag" style="color:var(--amber); border-color:var(--amber);">FAVORITES · 快速載入（免重跑 AI）</span>
          <button class="btn btn-xs" id="btnCloseFav" type="button">✕</button>
        </div>
        <div id="favEmptyHint" class="mono-tag" style="margin-top:8px; display:inline-block;">尚未收藏任何樂譜，載入樂譜後可按工具列愛心圖示加入</div>
        <div class="fav-grid" id="favGrid"></div>
      </div>

      <div id="omrStatusBox" class="omr-status-bar hidden">
        <span id="omrStatusText">準備中...</span>
        <button class="btn btn-xs hidden" id="btnRetryOmr" type="button">↻ 重新辨識</button>
      </div>

      <div id="analyzerOutput" class="hidden" style="margin-top:10px;">
        <div class="score-toolbar">
          <div class="row">
            <button class="btn btn-mint btn-xs" id="myBtnPlay" type="button">
              <span class="playback-icon"></span>
              <span class="playback-label">播放</span>
            </button>
            <button class="btn btn-xs" id="myBtnStop" type="button">■ 停止</button>
            <input type="range" id="myProgress" style="width:130px;" />
            <span class="mono-tag" id="myTime">0:00 / 0:00</span>
            <select id="mySpeed"></select>
            <button class="btn btn-xs" id="myBtnLoop" type="button">循環</button>
            <button class="btn btn-xs" id="myBtnMetro" type="button">節拍</button>
          </div>

          <div class="row">
            <!-- 純 SVG 加入/移除我的最愛按鍵 -->
            <button class="btn btn-icon" id="myBtnFavToggle" type="button" title="加入／移除我的最愛" aria-label="加入／移除我的最愛">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>

            <div class="row" id="myViewSwitch">
              <button class="btn btn-xs" id="myViewStaff" type="button">五線譜</button>
              <button class="btn btn-xs" id="myViewMixed" type="button">混排</button>
              <button class="btn btn-xs" id="myViewOriginal" type="button">簡譜</button>
              <button class="btn btn-xs" id="myViewExpanded" type="button">投影</button>
            </div>
            <button class="btn btn-xs" id="myBtnZoomOut" type="button">－</button>
            <button class="btn btn-xs" id="myBtnZoomReset" type="button">100%</button>
            <button class="btn btn-xs" id="myBtnZoomIn" type="button">＋</button>
            <button class="btn btn-xs" id="myBtnPrevPage" type="button">‹</button>
            <button class="btn btn-xs" id="myBtnNextPage" type="button">›</button>
            <button class="btn btn-xs" id="myBtnExportXml" type="button">↓ XML</button>
          </div>
        </div>

        <div class="sl-score-box">
          <div id="score-pane"></div>
        </div>
        <div id="code-pane-hidden" style="display:none;"></div>
      </div>
    </section>

    <!-- 2. 測驗 -->
    <section id="quizSection" class="panel hidden">
      <div class="row between" style="margin-bottom:10px;">
        <div class="row">
          <button class="btn btn-mint" id="btnPlayQuestion">▶ 播放</button>
          <button class="btn" id="btnStopAudio">■</button>
          <button class="btn" id="btnNextQuestion">⏭</button>
        </div>
        <div class="row">
          <span class="mono-tag"><b id="statCorrect">0</b>/<b id="statTotal">0</b></span>
          <span class="mono-tag">×<b id="statStreak">0</b></span>
        </div>
      </div>
      <div class="grid-2" id="optionsGrid"></div>
      <div class="result-strip" id="feedbackBanner">
        <span id="feedbackText"></span>
        <button class="btn btn-mint btn-xs" id="btnBannerNext">NEXT ➜</button>
      </div>
    </section>

    <!-- 3. 圖鑑 -->
    <section id="librarySection" class="panel hidden">
      <div class="row between" style="margin-bottom:10px;">
        <span class="mono-tag">PATTERNS</span>
        <button class="btn btn-xs" id="btnLibStop">■</button>
      </div>
      <div class="grid-2" id="libraryList"></div>
    </section>
  </div>

  <script>
    // ==========================================
    // 1. IndexedDB + localStorage 我的最愛存儲
    // ==========================================
    const FAV_DB_NAME = 'scorelab_favorites_db';
    const FAV_STORE = 'scores';
    const FAV_META_LS = 'scorelab_favorites_meta_v1';
    const VIEW_LABEL = { staff: '五線譜', mixed: '混排', original: '簡譜', expanded: '投影' };

    function openFavDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(FAV_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(FAV_STORE)) {
            db.createObjectStore(FAV_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllFavorites() {
      const db = await openFavDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FAV_STORE, 'readonly');
        const req = tx.objectStore(FAV_STORE).getAll();
        req.onsuccess = () => {
          const list = (req.result || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          try {
            localStorage.setItem(FAV_META_LS, JSON.stringify(list.map(x => ({ id: x.id, hash: x.hash, title: x.title, viewMode: x.viewMode, createdAt: x.createdAt }))));
          } catch {}
          resolve(list);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function putFavorite(record) {
      const db = await openFavDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FAV_STORE, 'readwrite');
        tx.objectStore(FAV_STORE).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteFavorite(id) {
      const db = await openFavDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FAV_STORE, 'readwrite');
        tx.objectStore(FAV_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function hashSnapshot(format, text) {
      let h = 2166136261;
      const str = `${format}:${text}`;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return `${format}:${str.length}:${(h >>> 0).toString(36)}`;
    }

    let currentFavHash = null;

    async function syncFavToggleButton() {
      const btn = document.getElementById('myBtnFavToggle');
      const snap = window.__dolceEngine?.getSnapshot();
      if (!snap) {
        currentFavHash = null;
        btn.classList.remove('fav-saved');
        btn.querySelector('path').setAttribute('fill', 'none');
        return;
      }
      currentFavHash = hashSnapshot(snap.format, snap.text);
      const list = await getAllFavorites();
      const hit = list.some(x => x.hash === currentFavHash);
      btn.classList.toggle('fav-saved', hit);
      btn.querySelector('path').setAttribute('fill', hit ? 'currentColor' : 'none');
    }

    async function renderFavoritesPanel() {
      const list = await getAllFavorites();
      const grid = document.getElementById('favGrid');
      const empty = document.getElementById('favEmptyHint');
      grid.innerHTML = '';
      empty.classList.toggle('hidden', list.length > 0);

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'fav-card' + (item.hash === currentFavHash ? ' current' : '');

        const info = document.createElement('div');
        info.className = 'fav-info';
        const d = new Date(item.createdAt || Date.now());
        const dt = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        info.innerHTML = `<div class="fav-title"></div><div class="fav-sub">${VIEW_LABEL[item.viewMode] || '樂譜'} · ${dt}</div>`;
        info.querySelector('.fav-title').textContent = item.title || '已儲存樂譜';

        const actions = document.createElement('div');
        actions.className = 'row';
        actions.style.gap = '4px';

        const btnRename = document.createElement('button');
        btnRename.type = 'button';
        btnRename.className = 'btn btn-xs btn-icon';
        btnRename.title = '重新命名';
        btnRename.setAttribute('aria-label', '重新命名');
        btnRename.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
        btnRename.addEventListener('click', async (e) => {
          e.stopPropagation();
          const next = prompt('修改最愛樂譜名稱：', item.title || '已儲存樂譜');
          if (next && next.trim()) {
            item.title = next.trim();
            await putFavorite(item);
            await renderFavoritesPanel();
          }
        });

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn btn-xs btn-icon';
        btnDel.title = '移除最愛';
        btnDel.setAttribute('aria-label', '移除最愛');
        btnDel.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>`;
        btnDel.addEventListener('click', async (e) => {
          e.stopPropagation();
          await deleteFavorite(item.id);
          await syncFavToggleButton();
          await renderFavoritesPanel();
        });

        actions.append(btnRename, btnDel);
        card.append(info, actions);

        card.addEventListener('click', async () => {
          setOmrStatus('正在快速讀取最愛樂譜...');
          try {
            const eng = await ensureDolceEngine();
            await eng.loadSnapshot(item);
            document.getElementById('analyzerOutput').classList.remove('hidden');
            document.getElementById('favPanel').classList.add('hidden');
            document.getElementById('myBtnFavList').classList.remove('fav-open');
            await syncFavToggleButton();
            await renderFavoritesPanel();
            setOmrStatus('✓ 已從我的最愛快速載入', 'ok');
          } catch (err) {
            console.error(err);
            setOmrStatus(`✕ 讀取失敗：${err?.message || err}`, 'err');
          }
        });

        grid.appendChild(card);
      });
    }

    // ==========================================
    // 2. 樂譜區：串接官方 Dolce 核心引擎 + 多頁排序
    // ==========================================
    let lastOmrFiles = [];
    let pendingQueue = []; // [{ file, url }]
    let dragIndex = -1;
    let enginePromise = null;

    function clearPendingQueue() {
      pendingQueue.forEach(item => { try { URL.revokeObjectURL(item.url); } catch {} });
      pendingQueue = [];
      document.getElementById('multiQueuePanel').classList.add('hidden');
      document.getElementById('multiQueueGrid').innerHTML = '';
    }

    function renderMultiQueue() {
      const grid = document.getElementById('multiQueueGrid');
      grid.innerHTML = '';
      pendingQueue.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'queue-item';
        card.draggable = true;

        card.addEventListener('dragstart', () => { dragIndex = idx; card.classList.add('dragging'); });
        card.addEventListener('dragend', () => { dragIndex = -1; card.classList.remove('dragging'); });
        card.addEventListener('dragover', (e) => e.preventDefault());
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          if (dragIndex >= 0 && dragIndex !== idx) {
            const [moved] = pendingQueue.splice(dragIndex, 1);
            pendingQueue.splice(idx, 0, moved);
            renderMultiQueue();
          }
        });

        const img = document.createElement('img');
        img.className = 'queue-thumb';
        img.src = item.url;
        img.alt = `第 ${idx + 1} 頁`;

        const foot = document.createElement('div');
        foot.className = 'queue-foot';

        const badge = document.createElement('span');
        badge.className = 'mono-tag';
        badge.style.color = 'var(--mint)';
        badge.textContent = `第 ${idx + 1} 頁`;

        const btns = document.createElement('div');
        btns.className = 'row';
        btns.style.gap = '3px';

        const up = document.createElement('button');
        up.type = 'button'; up.className = 'btn btn-xs'; up.textContent = '↑'; up.disabled = idx === 0;
        up.addEventListener('click', () => {
          [pendingQueue[idx - 1], pendingQueue[idx]] = [pendingQueue[idx], pendingQueue[idx - 1]];
          renderMultiQueue();
        });

        const down = document.createElement('button');
        down.type = 'button'; down.className = 'btn btn-xs'; down.textContent = '↓'; down.disabled = idx === pendingQueue.length - 1;
        down.addEventListener('click', () => {
          [pendingQueue[idx + 1], pendingQueue[idx]] = [pendingQueue[idx], pendingQueue[idx + 1]];
          renderMultiQueue();
        });

        const del = document.createElement('button');
        del.type = 'button'; del.className = 'btn btn-xs'; del.textContent = '✕';
        del.addEventListener('click', () => {
          const [removed] = pendingQueue.splice(idx, 1);
          try { URL.revokeObjectURL(removed.url); } catch {}
          if (pendingQueue.length === 0) clearPendingQueue();
          else renderMultiQueue();
        });

        btns.append(up, down, del);
        foot.append(badge, btns);
        card.append(img, foot);
        grid.appendChild(card);
      });
    }

    function handlePickedFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;
      if (files.length === 1) {
        clearPendingQueue();
        void loadScoreFiles([files[0]]);
        return;
      }
      const images = files
        .filter(f => /\.(png|jpe?g|webp)$/i.test(f.name) || f.type.startsWith('image/'))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      if (images.length === 0) {
        clearPendingQueue();
        void loadScoreFiles([files[0]]);
        return;
      }
      if (images.length === 1) {
        clearPendingQueue();
        void loadScoreFiles([images[0]]);
        return;
      }
      clearPendingQueue();
      pendingQueue = images.map(file => ({ file, url: URL.createObjectURL(file) }));
      document.getElementById('multiQueuePanel').classList.remove('hidden');
      renderMultiQueue();
    }

    function setOmrStatus(msg, state = '') {
      const box = document.getElementById('omrStatusBox');
      const txt = document.getElementById('omrStatusText');
      const retry = document.getElementById('btnRetryOmr');
      box.className = `omr-status-bar ${state}`.trim();
      txt.textContent = msg;
      const isOmr = lastOmrFiles.length > 0 && lastOmrFiles.every(f => /\.(pdf|png|jpe?g|webp)$/i.test(f.name) || f.type.startsWith('image/'));
      retry.classList.toggle('hidden', !isOmr);
    }

    function ensureDolceEngine() {
      if (enginePromise) return enginePromise;
      enginePromise = (async () => {
        if (!window.__dolceEngine) {
          await new Promise((resolve) => window.addEventListener('dolce-engine-ready', resolve, { once: true }));
        }
        const zoomBtn = document.getElementById('myBtnZoomReset');
        const viewBtns = new Map([
          ['staff', document.getElementById('myViewStaff')],
          ['mixed', document.getElementById('myViewMixed')],
          ['original', document.getElementById('myViewOriginal')],
          ['expanded', document.getElementById('myViewExpanded')],
        ]);
        await window.__dolceEngine.mount({
          scorePane: document.getElementById('score-pane'),
          hiddenCodePane: document.getElementById('code-pane-hidden'),
          statusEl: null,
          playBtn: document.getElementById('myBtnPlay'),
          stopBtn: document.getElementById('myBtnStop'),
          progressEl: document.getElementById('myProgress'),
          timeEl: document.getElementById('myTime'),
          speedSel: document.getElementById('mySpeed'),
          loopBtn: document.getElementById('myBtnLoop'),
          metroBtn: document.getElementById('myBtnMetro'),
          viewSwitch: document.getElementById('myViewSwitch'),
          viewBtns,
          onZoomChange: (z) => {
            if (zoomBtn) zoomBtn.textContent = `${Math.round(z * 100)}%`;
          },
        });
        return window.__dolceEngine;
      })();
      return enginePromise;
    }

    async function loadScoreFiles(files) {
      lastOmrFiles = [...files];
      const first = files[0];
      const name = first.name.toLowerCase();
      document.getElementById('analyzerOutput').classList.add('hidden');
      setOmrStatus('正在初始化樂譜與 AI 引擎...');
      try {
        const eng = await ensureDolceEngine();

        if (files.length === 1 && (name.endsWith('.mid') || name.endsWith('.midi'))) {
          setOmrStatus('正在解析 MIDI...');
          const buf = await first.arrayBuffer();
          const parsed = parseMIDI(buf);
          const xml = exportScoreToMusicXML(parsed.trackViews[0].bars, parsed.bpm || 100);
          await eng.loadXmlText(xml, 'mixed');
          document.getElementById('analyzerOutput').classList.remove('hidden');
          await syncFavToggleButton();
          setOmrStatus('✓ 已載入 MIDI 樂譜', 'ok');
          return;
        }

        const kind = document.getElementById('omrKindSelect').value;
        const res = await eng.loadFiles(files, {
          kind,
          onProgress: (msg) => setOmrStatus(msg),
        });
        document.getElementById('analyzerOutput').classList.remove('hidden');
        await syncFavToggleButton();
        setOmrStatus(`✓ 完成：${res.info}`, 'ok');
      } catch (err) {
        console.error(err);
        document.getElementById('analyzerOutput').classList.add('hidden');
        setOmrStatus(`✕ 失敗：${err?.message || err}`, 'err');
      }
    }

    // MIDI -> MusicXML 轉換
    function parseMIDI(arrayBuffer) {
      const dv = new DataView(arrayBuffer); let pos = 0;
      const readStr = (len) => { let s = ''; for (let i = 0; i < len; i++) s += String.fromCharCode(dv.getUint8(pos++)); return s; };
      const readVLQ = () => {
        let val = 0;
        while (pos < dv.byteLength) { const b = dv.getUint8(pos++); val = (val << 7) | (b & 0x7f); if ((b & 0x80) === 0) break; }
        return val;
      };
      if (readStr(4) !== 'MThd') throw new Error('Invalid MIDI');
      const hdrLen = dv.getUint32(pos); pos += 4; pos += 2;
      const numTracks = dv.getUint16(pos); pos += 2;
      const division = dv.getUint16(pos); pos += 2;
      if (hdrLen > 6) pos += (hdrLen - 6);

      const tempoMap = [{ tick: 0, bpm: 100 }], timeSigMap = [{ tick: 0, num: 4, den: 4 }], keySigMap = [{ tick: 0, sf: 0, mi: 0 }];
      const rawTracks = [];

      for (let t = 0; t < numTracks; t++) {
        if (pos + 8 > dv.byteLength) break;
        const tag = readStr(4), trkLen = dv.getUint32(pos); pos += 4;
        const trkEnd = Math.min(dv.byteLength, pos + trkLen);
        if (tag !== 'MTrk') { pos = trkEnd; continue; }
        let tick = 0, runningStatus = 0;
        const activeNotes = new Map(), notes = [];

        while (pos < trkEnd) {
          tick += readVLQ(); if (pos >= trkEnd) break;
          let status = dv.getUint8(pos);
          if (status < 0x80) status = runningStatus;
          else { pos++; if (status < 0xf0) runningStatus = status; }

          if (status === 0xff) {
            const metaType = dv.getUint8(pos++), len = readVLQ();
            if (metaType === 0x51 && len === 3) {
              const us = (dv.getUint8(pos) << 16) | (dv.getUint8(pos + 1) << 8) | dv.getUint8(pos + 2);
              tempoMap.push({ tick, bpm: Math.round(60000000 / us) });
            } else if (metaType === 0x58 && len >= 2) {
              timeSigMap.push({ tick, num: dv.getUint8(pos), den: Math.pow(2, dv.getUint8(pos + 1)) });
            } else if (metaType === 0x59 && len >= 2) {
              keySigMap.push({ tick, sf: dv.getInt8(pos), mi: dv.getUint8(pos + 1) });
            }
            pos += len;
          } else if (status === 0xf0 || status === 0xf7) {
            pos += readVLQ();
          } else {
            const type = status & 0xf0, ch = status & 0x0f, d1 = dv.getUint8(pos++);
            const d2 = (type === 0xc0 || type === 0xd0) ? 0 : dv.getUint8(pos++);
            if (type === 0x90 && d2 > 0) {
              const k = (ch << 8) | d1; if (!activeNotes.has(k)) activeNotes.set(k, []); activeNotes.get(k).push(tick);
            } else if (type === 0x80 || (type === 0x90 && d2 === 0)) {
              const k = (ch << 8) | d1, q = activeNotes.get(k);
              if (q && q.length > 0) {
                const startTick = q.shift();
                notes.push({ startTick, durTicks: Math.max(division * 0.25, tick - startTick), midi: d1 });
              }
            }
          }
        }
        pos = trkEnd;
        if (notes.length > 0) rawTracks.push({ short: `T${rawTracks.length + 1}`, notes });
      }
      if (rawTracks.length === 0) throw new Error('MIDI 沒有音符');
      tempoMap.sort((a, b) => a.tick - b.tick); timeSigMap.sort((a, b) => a.tick - b.tick); keySigMap.sort((a, b) => a.tick - b.tick);
      const getAt = (arr, tick) => { let cur = arr[0]; for (const item of arr) { if (item.tick <= tick + 10) cur = item; else break; } return cur; };

      let maxTick = 0;
      for (const rt of rawTracks) for (const nt of rt.notes) maxTick = Math.max(maxTick, nt.startTick + nt.durTicks);
      const tol = division * 0.08, combinedBars = [];
      let barTick = 0, barIdx = 0;

      while (barTick < maxTick && barIdx < 500) {
        const ts = getAt(timeSigMap, barTick), ks = getAt(keySigMap, barTick);
        const barBeats = ts.num * (4 / ts.den), barTicks = barBeats * division;
        const voices = rawTracks.map(rt => {
          const inBar = rt.notes
            .filter(n => n.startTick >= barTick - tol && n.startTick < barTick + barTicks - tol)
            .map(n => ({ start: (n.startTick - barTick) / division, dur: n.durTicks / division, midis: [n.midi] }));
          return { label: rt.short, events: normalizePolyBarEvents(inBar, barBeats) };
        });
        if (voices.some(v => v.events.some(e => e.type === 'note')) || barIdx === 0) {
          combinedBars.push({ barBeats, timeSig: `${ts.num}/${ts.den}`, keyFifths: ks.sf, voices });
        }
        barTick += barTicks; barIdx++;
      }
      const initBpm = tempoMap.find(x => x.tick === 0)?.bpm || tempoMap[1]?.bpm || 100;
      return { bpm: initBpm, trackViews: [{ bars: combinedBars }] };
    }

    function normalizePolyBarEvents(rawNotes, barBeats) {
      const grid16 = 0.25, gridTri = 1 / 3;
      const quantize = (val) => {
        const q16 = Math.round(val / grid16) * grid16, qTri = Math.round(val / gridTri) * gridTri;
        return Math.abs(val - qTri) + 0.01 < Math.abs(val - q16) ? qTri : q16;
      };
      const cleaned = rawNotes
        .map(x => ({ start: Math.max(0, quantize(x.start)), dur: Math.max(0.25, quantize(x.dur)), midis: [...x.midis] }))
        .filter(x => x.start < barBeats - 0.05)
        .sort((a, b) => a.start - b.start);
      const grouped = [];
      cleaned.forEach(item => {
        const prev = grouped[grouped.length - 1];
        if (prev && Math.abs(prev.start - item.start) < 0.06) {
          item.midis.forEach(m => { if (!prev.midis.includes(m)) prev.midis.push(m); });
          if (item.dur > prev.dur) prev.dur = item.dur;
        } else grouped.push(item);
      });
      const result = [];
      let cursor = 0;
      const pushRests = (start, totalDur) => {
        let cur = start, rem = totalDur;
        while (rem > 0.06) {
          const toBeat = Math.floor(cur + 0.02) + 1 - cur;
          let chunk = rem;
          if (rem > toBeat + 0.05 && Math.abs(cur - Math.floor(cur)) > 0.05) chunk = toBeat;
          else if (chunk > 2) chunk = 2;
          else if (chunk > 1 && chunk < 1.95) chunk = 1;
          result.push({ start: cur, dur: chunk, type: 'rest' });
          cur += chunk; rem -= chunk;
        }
      };
      grouped.forEach(note => {
        if (note.start > cursor + 0.06) { pushRests(cursor, note.start - cursor); cursor = note.start; }
        const avail = Math.min(note.dur, barBeats - cursor);
        if (avail >= 0.2) { result.push({ start: cursor, dur: avail, type: 'note', midis: note.midis }); cursor += avail; }
      });
      if (cursor < barBeats - 0.06) pushRests(cursor, barBeats - cursor);
      return result;
    }

    function exportScoreToMusicXML(bars, bpm = 92) {
      const divs = 12;
      const sharpSpell = [['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
      const flatSpell  = [['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
      const numVoices = Math.max(1, bars[0]?.voices?.length || 1);
      const kf = bars[0]?.keyFifths || 0;
      let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<score-partwise version="3.1">\n  <part-list><score-part id="P1"><part-name>Score</part-name></score-part></part-list>\n  <part id="P1">\n`;
      bars.forEach((bar, bIdx) => {
        const [bts, btp] = (bar.timeSig || '4/4').split('/');
        xml += `    <measure number="${bIdx + 1}">\n`;
        if (bIdx === 0) {
          xml += `      <attributes><divisions>${divs}</divisions><key><fifths>${kf}</fifths></key><time><beats>${bts}</beats><beat-type>${btp}</beat-type></time><staves>${numVoices > 1 ? 2 : 1}</staves></attributes>\n`;
          xml += `      <sound tempo="${bpm}"/>\n`;
        }
        const barDivs = Math.round((bar.barBeats || 4) * divs);
        (bar.voices || []).forEach((v, vIdx) => {
          if (vIdx > 0) xml += `      <backup><duration>${barDivs}</duration></backup>\n`;
          const staff = vIdx === 0 ? 1 : 2;
          v.events.forEach(ev => {
            const durDivs = Math.max(1, Math.round(ev.dur * divs));
            if (ev.type === 'rest') {
              xml += `      <note><rest/><duration>${durDivs}</duration><voice>${vIdx + 1}</voice><staff>${staff}</staff></note>\n`;
            } else {
              (ev.midis && ev.midis.length ? ev.midis : [60]).forEach((m, mi) => {
                const oct = Math.floor(m / 12) - 1;
                const [step, alter] = (kf < 0 ? flatSpell : sharpSpell)[((m % 12) + 12) % 12];
                xml += `      <note>${mi > 0 ? '<chord/>' : ''}<pitch><step>${step}</step>${alter ? `<alter>${alter}</alter>` : ''}<octave>${oct}</octave></pitch><duration>${durDivs}</duration><voice>${vIdx + 1}</voice><staff>${staff}</staff></note>\n`;
              });
            }
          });
        });
        xml += `    </measure>\n`;
      });
      xml += `  </part>\n</score-partwise>`;
      return xml;
    }

    function compileBuiltIn(pattern, symMode = '1', barIdx = 0) {
      const events = [];
      let cursor = 0;
      const ch = symMode === 'X' ? 'X' : '1';
      function walk(tok) {
        if (tok.t === 'n') { const idx = events.length; events.push({ start: cursor, dur: tok.dur, type: 'note', midis: [60] }); cursor += tok.dur; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}</span>`; }
        if (tok.t === 'r') { const idx = events.length; events.push({ start: cursor, dur: tok.dur, type: 'rest' }); cursor += tok.dur; return `<span class="j-ev j-rest" data-bar="${barIdx}" data-v="0" data-ev="${idx}">0</span>`; }
        if (tok.t === 'half') { const idx = events.length; events.push({ start: cursor, dur: 2, type: 'note', midis: [60] }); cursor += 2; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}<span class="j-dash">-</span></span>`; }
        if (tok.t === 'dotQ') { const idx = events.length; events.push({ start: cursor, dur: 1.5, type: 'note', midis: [60] }); cursor += 1.5; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}<span class="j-dot">·</span></span>`; }
        if (tok.t === 'dot8') { const idx = events.length; events.push({ start: cursor, dur: 0.75, type: 'note', midis: [60] }); cursor += 0.75; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}<span class="j-dot">·</span></span>`; }
        if (tok.t === 'u1') return `<span class="u1">${tok.items.map(walk).join('')}</span>`;
        if (tok.t === 'u2') return `<span class="u2-inner">${tok.items.map(walk).join('')}</span>`;
        if (tok.t === 'sync') return `<span class="j-group-tight">${tok.items.map(walk).join('')}</span>`;
        if (tok.t === 'tri') return `<span class="triplet"><span class="u1">${tok.items.map(walk).join('')}</span></span>`;
        return '';
      }
      return { html: `<div class="jianpu-bar">${pattern.groups.map(walk).join('')}</div>`, events, barBeats: 4 };
    }

    let audioCtx = null, playbackSession = 0, schedulerTimer = null, rafId = null, activeAudioNodes = [];
    function ensureAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function stopQuizAudio() {
      playbackSession++;
      if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      activeAudioNodes.forEach(node => { try { node.stop(); } catch {} try { node.disconnect(); } catch {} });
      activeAudioNodes = [];
      document.querySelectorAll('#beatDots .led').forEach(l => l.classList.remove('countin', 'playing'));
      document.getElementById('beatStatus').textContent = 'READY';
      document.querySelectorAll('.j-ev.active-note').forEach(el => el.classList.remove('active-note'));
      document.querySelectorAll('.playing-card').forEach(el => el.classList.remove('playing-card'));
    }
    function playQuizPattern(pat, cardEl = null, containerEl = null) {
      ensureAudioCtx(); stopQuizAudio();
      const mySession = playbackSession, bpm = Number(document.getElementById('bpmRange').value), beatSec = 60 / bpm;
      const useCountIn = document.getElementById('chkCountIn').checked, useMetro = document.getElementById('chkMetro').checked;
      const soundType = document.getElementById('soundSelect').value, symMode = document.getElementById('symbolSelect').value;
      const compiled = compileBuiltIn(pat, symMode, 0);
      const countIn = useCountIn ? 4 : 0, startTime = audioCtx.currentTime + 0.07, barStart = startTime + countIn * beatSec, totalEnd = barStart + 4 * beatSec;
      const q = [];
      for (let b = 0; b < countIn; b++) q.push({ time: startTime + b * beatSec, kind: 'metro', accent: b === 0 });
      if (useMetro) for (let b = 0; b < 4; b++) q.push({ time: barStart + b * beatSec, kind: 'metro', accent: b === 0 });
      compiled.events.forEach(ev => { if (ev.type === 'note') q.push({ time: barStart + ev.start * beatSec, durSec: ev.dur * beatSec, kind: 'note' }); });
      q.sort((a, b) => a.time - b.time);
      let idx = 0;
      const sched = () => {
        if (mySession !== playbackSession) return;
        const h = audioCtx.currentTime + 0.25;
        while (idx < q.length && q[idx].time <= h) {
          const it = q[idx++];
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          if (it.kind === 'metro') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(it.accent ? 1480 : 960, it.time);
            gain.gain.setValueAtTime(0.0001, it.time); gain.gain.linearRampToValueAtTime(it.accent ? 0.2 : 0.11, it.time + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.0001, it.time + 0.04);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(it.time); osc.stop(it.time + 0.045);
          } else {
            const d = Math.max(0.07, it.durSec * 0.9);
            osc.type = soundType === 'synth' ? 'sawtooth' : 'triangle';
            osc.frequency.setValueAtTime(soundType === 'wood' ? 780 : 261.63, it.time);
            gain.gain.setValueAtTime(0.0001, it.time); gain.gain.linearRampToValueAtTime(0.32, it.time + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, it.time + (soundType === 'wood' ? 0.085 : d));
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(it.time); osc.stop(it.time + d + 0.02);
          }
          activeAudioNodes.push(osc);
        }
      };
      sched(); schedulerTimer = setInterval(sched, 60);
      const tick = () => {
        if (mySession !== playbackSession) return;
        const now = audioCtx.currentTime;
        if (now >= totalEnd + 0.06) { stopQuizAudio(); return; }
        const leds = document.querySelectorAll('#beatDots .led');
        leds.forEach(l => l.classList.remove('countin', 'playing'));
        if (now < barStart) {
          const b = Math.floor((now - startTime) / beatSec);
          if (b >= 0 && b < leds.length) leds[b].classList.add('countin');
          document.getElementById('beatStatus').textContent = 'COUNT';
        } else {
          const eb = (now - barStart) / beatSec, b = Math.floor(eb);
          if (b >= 0 && b < leds.length) leds[b].classList.add('playing');
          document.getElementById('beatStatus').textContent = `B.${Math.min(4, b + 1)}`;
          if (cardEl) cardEl.classList.add('playing-card');
          if (containerEl) {
            containerEl.querySelectorAll('.j-ev.active-note').forEach(el => el.classList.remove('active-note'));
            compiled.events.forEach((ev, evIdx) => {
              if (eb >= ev.start - 0.02 && eb < ev.start + ev.dur - 0.02) {
                containerEl.querySelector(`.j-ev[data-ev="${evIdx}"]`)?.classList.add('active-note');
              }
            });
          }
        }
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    let selectedCats = new Set(Object.keys(CATEGORIES)), currentTab = 'analyzer', currentQuestion = null, quizLocked = false;
    let stats = { correct: 0, total: 0, streak: 0 };

    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function initCategories() {
      const bar = document.getElementById('catBar');

    function generateQuestion(autoPlay = false) {
      stopQuizAudio(); quizLocked = false; document.getElementById('feedbackBanner').className = 'result-strip';
      const pool = PATTERNS.filter(p => selectedCats.has(p.cat)), target = pool[Math.floor(Math.random() * pool.length)];
      const seen = new Set([compileBuiltIn(target, '1').html]), dist = [];
      for (const c of shuffle(pool)) { if (dist.length >= 3) break; const h = compileBuiltIn(c, '1').html; if (!seen.has(h)) { seen.add(h); dist.push(c); } }
      currentQuestion = { target, options: shuffle([target, ...dist]) };
      renderQuizOptions();
      if (autoPlay) playQuizPattern(currentQuestion.target);
    }

    function renderQuizOptions() {
      if (!currentQuestion) return;
      const grid = document.getElementById('optionsGrid'), sym = document.getElementById('symbolSelect').value;

        card.innerHTML = `<span class="pad-idx">${k}</span><div class="opt-jianpu">${compileBuiltIn(opt, sym).html}</div><div class="pad-meta hidden"></div>`;
        card.addEventListener('click', () => handleQuizAnswer(opt));
        grid.appendChild(card);
      });

    function handleQuizAnswer(chosen) {
      if (quizLocked) return; quizLocked = true; stopQuizAudio();
      const ok = chosen.id === currentQuestion.target.id;
      stats.total++; if (ok) { stats.correct++; stats.streak++; } else { stats.streak = 0; }
      document.getElementById('statCorrect').textContent = stats.correct;
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statStreak').textContent = stats.streak;
      document.querySelectorAll('#optionsGrid .pad').forEach((card, i) => {
        card.classList.add('locked');
        const opt = currentQuestion.options[i], meta = card.querySelector('.pad-meta');
        meta.classList.remove('hidden'); meta.innerHTML = `<span>${opt.name}</span>`;

        btn.addEventListener('click', (e) => { e.stopPropagation(); playQuizPattern(opt, card, card.querySelector('.opt-jianpu')); });
        meta.appendChild(btn);
        if (opt.id === currentQuestion.target.id) card.classList.add('correct');

      });

      if (existing) {
        await deleteFavorite(existing.id);
        setOmrStatus('已從我的最愛移除', 'ok');
      } else {
        await putFavorite({
          id: `fav_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          hash,
          title: snap.title,
          format: snap.format,
          text: snap.text,
          viewMode: snap.viewMode,
          createdAt: Date.now(),
        });
        setOmrStatus('✓ 已加入我的最愛（下次點書籤圖示可秒開）', 'ok');
      }
      await syncFavToggleButton();
      if (!document.getElementById('favPanel').classList.contains('hidden')) {
        await renderFavoritesPanel();
      }
    });

    // 切換視圖時也同步我的最愛快照視圖狀態
    ['myViewStaff', 'myViewMixed', 'myViewOriginal', 'myViewExpanded'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => setTimeout(() => void syncFavToggleButton(), 150));
    });

    document.getElementById('btnLoadDemo').addEventListener('click', async (e) => {
      e.stopPropagation();
      lastOmrFiles = [];
      clearPendingQueue();
      document.getElementById('analyzerOutput').classList.add('hidden');
      setOmrStatus('正在載入範例...');
      try {
        const eng = await ensureDolceEngine();
        await eng.loadXmlText(DEMO_MUSICXML, 'mixed');
        document.getElementById('analyzerOutput').classList.remove('hidden');
        await syncFavToggleButton();
        setOmrStatus('✓ 已載入範例', 'ok');
      } catch (err) {
        console.error(err);
        document.getElementById('analyzerOutput').classList.add('hidden');
        setOmrStatus(`✕ 載入範例失敗：${err?.message || err}`, 'err');
      }
    });

    document.getElementById('myBtnZoomIn').addEventListener('click', () => window.__dolceEngine?.zoomBy(1.2));
    document.getElementById('myBtnZoomOut').addEventListener('click', () => window.__dolceEngine?.zoomBy(1 / 1.2));
    document.getElementById('myBtnZoomReset').addEventListener('click', () => window.__dolceEngine?.resetZoom());
    document.getElementById('myBtnPrevPage').addEventListener('click', () => window.__dolceEngine?.prevPage());
    document.getElementById('myBtnNextPage').addEventListener('click', () => window.__dolceEngine?.nextPage());

    document.getElementById('myBtnExportXml').addEventListener('click', async () => {
      const xml = await window.__dolceEngine?.exportXml();
      if (!xml) return;
      const blob = new Blob([xml], { type: 'application/vnd.recordare.musicxml+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'score.musicxml';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    initCategories();
    renderLibrary();
    generateQuestion(false);
    setTimeout(() => void ensureDolceEngine(), 300);
  </script>
</body>
</html>
