<head>

  <title>SCORE LAB · 樂譜工坊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link rel="modulepreload" href="/src/scorelab-omr.ts" />
  <script>
    // ==========================================
    // 0. 模型 / WASM / 字型 永久快取與啟動預載機制
    // ==========================================
    (() => {
      const CACHE_NAME = 'scorelab-model-cache-v1';
      const IDB_NAME = 'scorelab_model_blob_db';
      const IDB_STORE = 'assets';
      const PRELOAD_LS = 'scorelab_preload_urls_v1';
      const MAX_PRELOAD_URLS = 40;

      const origFetch = window.fetch.bind(window);
      const inflight = new Map();
      const memPending = new Set();

      function normalizeUrl(input) {
        try {
          const raw = typeof input === 'string'
            ? input
            : (input instanceof URL ? input.href : (input && input.url ? input.url : ''));
          if (!raw) return null;
          const u = new URL(raw, location.href);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
          return u;
        } catch {
          return null;
        }
      }

      function isCacheableModelOrAsset(u) {
        if (!u) return false;
        if (u.origin !== location.origin && u.protocol !== 'https:') return false;
        const p = u.pathname.toLowerCase();
        if (
          p.endsWith('.ts') || p.endsWith('.tsx') || p.endsWith('.js') ||
          p.endsWith('.mjs') || p.endsWith('.css') || p.endsWith('.html')
        ) {
          return false;
        }
        if (p.includes('/@vite') || p.includes('/@fs') || p.includes('/node_modules/.vite')) {
          return false;
        }
        if (/\.(onnx|ort|wasm|bin|pb|tflite|weights|model|data|woff2?|otf|traineddata)$/.test(p)) {
          return true;
        }
        if (/\/(models?|onnx|ort|wasm|omr|redist|smufl)\//.test(p) && /\.(json|txt|dat|map)$/.test(p)) {
          return true;
        }
        return false;
      }

      function hasRangeHeader(input, init) {
        try {
          if (init && init.headers) {
            const h = new Headers(init.headers);
            if (h.has('range')) return true;
          }
          if (input instanceof Request && input.headers.has('range')) return true;
        } catch {}
        return false;
      }

      function readPreloadManifest() {
        try {
          const raw = localStorage.getItem(PRELOAD_LS);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr.filter((x) => typeof x === 'string') : [];
        } catch {
          return [];
        }
      }

      function rememberPreloadUrl(urlHref) {
        try {
          const list = readPreloadManifest();
          if (!list.includes(urlHref)) {
            list.push(urlHref);
            if (list.length > MAX_PRELOAD_URLS) list.splice(0, list.length - MAX_PRELOAD_URLS);
            localStorage.setItem(PRELOAD_LS, JSON.stringify(list));
          }
        } catch {}
      }

      let idbPromise = null;
      function openAssetDB() {
        if (idbPromise) return idbPromise;
        if (!('indexedDB' in window)) return Promise.resolve(null);
        idbPromise = new Promise((resolve) => {
          try {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) {
                db.createObjectStore(IDB_STORE, { keyPath: 'url' });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
        return idbPromise;
      }

      async function getFromStore(urlHref) {
        if ('caches' in window) {
          try {
            const cache = await caches.open(CACHE_NAME);
            const hit = await cache.match(urlHref);
            if (hit) return hit;
          } catch {}
        }
        try {
          const db = await openAssetDB();
          if (!db) return null;
          return await new Promise((resolve) => {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const req = tx.objectStore(IDB_STORE).get(urlHref);
            req.onsuccess = () => {
              const rec = req.result;
              if (!rec || !rec.body) { resolve(null); return; }
              try {
                resolve(new Response(rec.body, {
                  status: rec.status || 200,
                  statusText: rec.statusText || 'OK',
                  headers: rec.headers || [],
                }));
              } catch {
                resolve(null);
              }
            };
            req.onerror = () => resolve(null);
          });
        } catch {
          return null;
        }
      }

      async function putIntoStore(urlHref, responseClone) {
        rememberPreloadUrl(urlHref);
        if ('caches' in window) {
          try {
            const cache = await caches.open(CACHE_NAME);
            await cache.put(urlHref, responseClone);
            return;
          } catch {}
        }
        try {
          const db = await openAssetDB();
          if (!db) return;
          const buf = await responseClone.arrayBuffer();
          const headers = [];
          responseClone.headers.forEach((v, k) => headers.push([k, v]));
          await new Promise((resolve) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put({
              url: urlHref,
              status: responseClone.status || 200,
              statusText: responseClone.statusText || 'OK',
              headers,
              body: buf,
              savedAt: Date.now(),
            });
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch {}
      }

      async function fetchWithPersistentCache(input, init, urlHref) {
        const cached = await getFromStore(urlHref);
        if (cached) {
          rememberPreloadUrl(urlHref);
          return cached;
        }

        if (inflight.has(urlHref)) {
          const shared = await inflight.get(urlHref);
          return shared.clone();
        }

        const p = (async () => {
          const resp = await origFetch(input, init);
          if (resp && resp.ok && resp.status === 200 && !resp.bodyUsed) {
            try {
              const copy = resp.clone();
              void putIntoStore(urlHref, copy);
            } catch {}
          }
          return resp;
        })();

        inflight.set(urlHref, p);
        try {
          const res = await p;
          return res.clone();
        } finally {
          inflight.delete(urlHref);
        }
      }

      window.fetch = function (input, init) {
        const method = (
          (init && init.method) ||
          (input instanceof Request ? input.method : 'GET')
        ).toUpperCase();
        const u = normalizeUrl(input);

        if (method === 'GET' && u && isCacheableModelOrAsset(u) && !hasRangeHeader(input, init)) {
          return fetchWithPersistentCache(input, init, u.href);
        }
        return origFetch(input, init);
      };

      async function warmUrl(urlHref) {
        if (memPending.has(urlHref)) return;
        memPending.add(urlHref);
        try {
          const hit = await getFromStore(urlHref);
          if (hit) return;
          const resp = await origFetch(urlHref, { cache: 'force-cache' });
          if (resp && resp.ok && resp.status === 200 && !resp.bodyUsed) {
            await putIntoStore(urlHref, resp.clone());
          }
        } catch {}
      }

      function injectPreloadLink(urlHref) {
        try {
          const p = new URL(urlHref).pathname.toLowerCase();
          const link = document.createElement('link');
          link.rel = 'preload';
          link.href = urlHref;
          if (/\.(woff2?|otf)$/.test(p)) {
            link.as = 'font';
            link.crossOrigin = 'anonymous';
          } else {
            link.as = 'fetch';
            link.crossOrigin = 'anonymous';
          }
          document.head.appendChild(link);
        } catch {}
      }

      const knownUrls = readPreloadManifest();
      for (const u of knownUrls) {
        const parsed = normalizeUrl(u);
        if (parsed && isCacheableModelOrAsset(parsed)) {
          injectPreloadLink(parsed.href);
          void warmUrl(parsed.href);
        }
      }

      if ('PerformanceObserver' in window) {
        try {
          const po = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
              const u = normalizeUrl(entry.name);
              if (u && isCacheableModelOrAsset(u)) {
                rememberPreloadUrl(u.href);
                void warmUrl(u.href);
              }
            }
          });
          po.observe({ type: 'resource', buffered: true });
        } catch {}
      }

      window.__scorelabPreload = {
        warmUrl,
        listCached: readPreloadManifest,
      };
    })();
  </script>

    /* 無印良品 × 莫蘭迪日式色系（使用獨立 --sl-* 變數避免被官方 styles.css 覆蓋） */

      --sl-rose-bg: #f5e9e9;
      --sl-amber: #b88b4a;
      --sl-amber-bg: #f5efe3;

      --sl-coral-bg: #f6eaea;

      --sl-serif: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
    }

      height: auto !important;

      overflow-x: hidden !important;

      background: var(--sl-bg) !important;
      color: var(--sl-text) !important;
      font-family: var(--sl-serif) !important;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    body.sl-body { padding: 18px 14px 64px !important; }

    #sl-app button, #sl-app select, #sl-app input {
      font-family: var(--sl-serif);
      margin: 0;
    }

    #sl-app.sl-app { max-width: 1080px; margin: 0 auto; }

    /* Topbar */
    #sl-app .topbar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; padding-bottom: 14px;
      border-bottom: 1px solid var(--sl-line); margin-bottom: 16px;
    }
    #sl-app .brand { display: flex; align-items: center; gap: 10px; }
    #sl-app .brand-sq { width: 10px; height: 10px; border-radius: 2px; background: var(--sl-sage); flex-shrink: 0; }
    #sl-app .brand h1 { margin: 0; font-size: 1.02rem; letter-spacing: 0.18em; font-weight: 700; color: var(--sl-text); }
    #sl-app .top-actions { display: flex; align-items: center; gap: 8px; }

    #sl-app .mono-tag {
      font-size: 0.76rem; color: var(--sl-muted); background: var(--sl-surface);
      border: 1px solid var(--sl-line); border-radius: 6px; padding: 0 9px;
      height: 30px; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0;
    }

    #sl-app .tabs {
      display: inline-flex; align-items: center; gap: 3px; background: var(--sl-surface-2);
      border: 1px solid var(--sl-line); border-radius: 8px; padding: 3px;
    }
    #sl-app .tab-btn {
      border: none; background: transparent; color: var(--sl-muted);
      padding: 0 14px; height: 28px; font-size: 0.84rem; font-weight: 600; cursor: pointer;
      border-radius: 6px; transition: background 0.15s, color 0.15s;
      display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
    }
    #sl-app .tab-btn.active {
      background: var(--sl-surface); color: var(--sl-text);
      box-shadow: 0 1px 3px rgba(47, 45, 42, 0.1);
    }

    /* Panels */
    #sl-app .panel {
      background: var(--sl-surface); border: 1px solid var(--sl-line);
      border-radius: 10px; padding: 16px; margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(47, 45, 42, 0.03);
    }
    #sl-app .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    #sl-app .row-nowrap { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 6px; }
    #sl-app .between { justify-content: space-between; }

      display: inline-flex; align-items: center; gap: 8px; height: 32px;
      background: var(--sl-surface-2); border: 1px solid var(--sl-line);
      border-radius: 6px; padding: 0 10px; font-size: 0.8rem; color: var(--sl-text);
    }

      border-radius: 6px; padding: 0 10px; height: 32px; font-size: 0.82rem; font-weight: 600;
      outline: none; cursor: pointer; vertical-align: middle; flex-shrink: 0;

    #sl-app .toggle {
      display: inline-flex; align-items: center; gap: 6px; height: 32px;
      background: var(--sl-surface-2); border: 1px solid var(--sl-line); border-radius: 6px;
      padding: 0 10px; font-size: 0.8rem; font-weight: 600; color: var(--sl-muted);
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #sl-app .toggle input { display: none; }
    #sl-app .toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sl-line-hi); }
    #sl-app .toggle.on { color: var(--sl-sage); border-color: var(--sl-sage); background: var(--sl-sage-bg); }
    #sl-app .toggle.on .dot { background: var(--sl-sage); }

    /* 按鍵（統一高度與幾何對齊，防止外部樣式破壞） */
    #sl-app .btn {
      border: 1px solid var(--sl-line-hi); background: var(--sl-surface); color: var(--sl-text);
      padding: 0 13px; height: 32px; line-height: 1; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 6px; transition: all 0.15s ease; white-space: nowrap; flex-shrink: 0; vertical-align: middle;
    }
    #sl-app .btn:hover:not(:disabled) { filter: brightness(0.96); }
    #sl-app .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    #sl-app .btn-xs { padding: 0 11px; height: 30px; font-size: 0.78rem; }
    #sl-app .btn-primary { background: var(--sl-sage); color: #fff; border-color: var(--sl-sage); }

    /* 純 SVG 圖示按鍵 */
    #sl-app .btn-icon {
      padding: 0 !important; width: 32px; min-width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    #sl-app .btn-icon.btn-xs { width: 28px; min-width: 28px; height: 28px; }
    #sl-app .btn-icon svg { width: 16px; height: 16px; display: block; pointer-events: none; flex-shrink: 0; }

    /* 工具列三行視覺分區 */
    #sl-app .toolbar-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    #sl-app .toolbar-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--sl-line);
    }

    /* Row 1: 播放列（莫蘭迪鼠尾草綠） */
    #sl-app .row-play { background: var(--sl-sage-bg); border-color: #cedad0; }
    #sl-app .row-play .btn { border-color: #b7cbb9; color: #3a523f; background: #f8fbf8; height: 32px; }
    #sl-app .row-play .btn-play-main { background: var(--sl-sage); color: #fff; border-color: var(--sl-sage); }
    #sl-app .row-play .btn.active { background: var(--sl-sage); color: #fff; border-color: var(--sl-sage); }
    #sl-app .row-play .btn-range.picking { background: var(--sl-amber); color: #fff; border-color: var(--sl-amber); }
    #sl-app .row-play .btn-range.picking.has-start { background: var(--sl-clay); color: #fff; border-color: var(--sl-clay); }
    #sl-app .row-play .btn-range-clear { border-color: #d9bbbb; color: var(--sl-coral); background: #fdf9f9; }
    #sl-app .row-play select { border-color: #b7cbb9; color: #3a523f; background: #f8fbf8; height: 32px; }
    #sl-app .row-play .mono-tag { background: #f8fbf8; border-color: #b7cbb9; color: #3a523f; height: 32px; }
    #sl-app .progress-wrap { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 180px; }
    #sl-app .progress-wrap input[type="range"] { flex: 1; min-width: 80px; height: 20px; }

    /* Row 2: 譜面視圖列（莫蘭迪霧霾藍 + 右側修譜開關） */
    #sl-app .row-view { background: var(--sl-slate-bg); border-color: #ced7e0; justify-content: space-between; }
    #sl-app .row-view .btn { border-color: #b7c4d1; color: #3b4b5c; background: #f7fafc; height: 30px; }
    #sl-app .row-view .btn.active { background: var(--sl-slate); color: #fff; border-color: var(--sl-slate); }
    #sl-app .row-view .btn-edit-mode { border-color: #d7c3a0; color: #73552a; background: #fcf9f2; }
    #sl-app .row-view .btn-edit-mode.active { background: var(--sl-amber); color: #fff; border-color: var(--sl-amber); }
    #sl-app .btn-edit-mode svg { width: 13px; height: 13px; display: block; flex-shrink: 0; }

    /* 修譜工具面板（展開式，莫蘭迪暖麥色） */
    #sl-app .edit-panel {
      margin-bottom: 10px; padding: 10px 12px; border-radius: 8px;
      background: var(--sl-amber-bg); border: 1px solid #dfd0b8;
      display: flex; flex-direction: column; gap: 8px;
    }
    #sl-app .edit-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    }
    #sl-app .edit-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    #sl-app .edit-badge {
      font-size: 0.74rem; font-weight: 700; padding: 0 9px; height: 26px;
      border-radius: 5px; display: inline-flex; align-items: center;
      background: var(--sl-surface); border: 1px solid #d7c3a0; color: #6a4d22;
      white-space: nowrap;
    }
    #sl-app .edit-beat-count {
      font-size: 0.74rem; font-weight: 700; padding: 0 9px; height: 26px;
      border-radius: 5px; display: inline-flex; align-items: center;
      background: var(--sl-coral-bg); border: 1px solid #dfc3c3; color: var(--sl-coral);
      cursor: pointer; white-space: nowrap;
    }
    #sl-app .edit-status {
      font-size: 0.75rem; color: var(--sl-clay); font-weight: 600;
    }
    #sl-app .edit-status:empty { display: none; }
    #sl-app .edit-panel .btn-xs {
      height: 26px; padding: 0 10px; font-size: 0.74rem;
      border-color: #d7c3a0; color: #6a4d22; background: var(--sl-surface);
    }
    #sl-app .edit-panel .btn-xs.active {
      background: var(--sl-amber); color: #fff; border-color: var(--sl-amber);
    }
    #sl-app #visual-palette {
      background: var(--sl-surface); border: 1px solid var(--sl-line);
      border-radius: 6px; padding: 6px 8px;
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      max-height: 170px; overflow-y: auto;

      min-height: 28px; padding: 2px 7px; border-radius: 5px;
      border: 1px solid var(--sl-line-hi); background: var(--sl-surface-2);
      color: var(--sl-text); font-size: 0.76rem; font-weight: 600; cursor: pointer;

    #sl-app .row-tools .btn { border-color: #cbbab0; color: #5e4739; background: #fbf9f7; height: 32px; }
    #sl-app .row-tools .btn-export { background: var(--sl-clay); color: #fff; border-color: var(--sl-clay); }

    #sl-app .btn-fav { border-color: #d9bbbb !important; color: var(--sl-rose) !important; background: #fdf9f9 !important; }
    #sl-app .btn-fav.fav-saved { background: var(--sl-rose) !important; color: #fff !important; border-color: var(--sl-rose) !important; }
    #sl-app .btn-fav-top.fav-open { background: var(--sl-rose-bg) !important; border-color: var(--sl-rose) !important; }

    #sl-app .cat-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--sl-line); }
    #sl-app .cat-pill {
      border: 1px solid var(--sl-line); background: var(--sl-surface-2); color: var(--sl-muted);

    #sl-app .led.playing { background: var(--sl-sage); }

    /* Quiz / Library */
    #sl-app .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (max-width: 680px) { #sl-app .grid-2 { grid-template-columns: 1fr; } }

    #sl-app .pad {
      position: relative; background: var(--sl-surface-2); border: 1px solid var(--sl-line); border-radius: 8px;
      padding: 22px 12px 14px; min-height: 110px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; overflow-x: auto;
    }
    #sl-app .pad:hover:not(.locked) { border-color: var(--sl-sage); }
    #sl-app .pad.correct { border-color: var(--sl-sage); background: var(--sl-sage-bg); }
    #sl-app .pad.wrong { border-color: var(--sl-coral); background: var(--sl-coral-bg); }
    #sl-app .pad.dimmed { opacity: 0.45; }
    #sl-app .pad-idx { position: absolute; top: 8px; left: 10px; font-size: 0.72rem; color: var(--sl-muted); font-weight: 700; }
    #sl-app .pad-meta { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--sl-text); font-weight: 600; }

    #sl-app .result-strip {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px; display: none;
      align-items: center; justify-content: space-between; font-size: 0.84rem; font-weight: 600; border: 1px solid transparent;
    }
    #sl-app .result-strip.show { display: flex; }
    #sl-app .result-strip.ok { background: var(--sl-sage-bg); border-color: var(--sl-sage); color: var(--sl-sage); }
    #sl-app .result-strip.err { background: var(--sl-coral-bg); border-color: var(--sl-coral); color: var(--sl-coral); }

    #sl-app .lib-card { background: var(--sl-surface-2); border: 1px solid var(--sl-line); border-radius: 8px; padding: 12px; cursor: pointer; overflow-x: auto; }
    #sl-app .playing-card { border-color: var(--sl-sage) !important; box-shadow: inset 0 0 0 1px var(--sl-sage); }
    #sl-app .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; color: var(--sl-text); }
    #sl-app .tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--sl-line); color: var(--sl-muted); background: var(--sl-surface); white-space: nowrap; }
    #sl-app .tag-sync { color: var(--sl-amber); border-color: #dfd0b8; }
    #sl-app .tag-dot { color: var(--sl-slate); border-color: #c9d4de; }
    #sl-app .tag-16 { color: var(--sl-clay); border-color: #dfd0c4; }
    #sl-app .tag-off { color: var(--sl-coral); border-color: #dfc3c3; }

    /* Dropzone */
    #sl-app .dropzone {
      border: 1.5px dashed var(--sl-line-hi); border-radius: 10px; padding: 18px 14px;
      text-align: center; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 10px; background: var(--sl-surface-2); transition: border-color 0.15s, background 0.15s;
    }
    #sl-app .dropzone:hover, #sl-app .dropzone.dragover { border-color: var(--sl-sage); background: var(--sl-sage-bg); }
    #sl-app .dropzone.processing {
      border-color: var(--sl-sage);
      animation: sl-dz-pulse 1.8s ease-in-out infinite;
    }
    @keyframes sl-dz-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(91, 122, 98, 0.18); }
      50% { box-shadow: 0 0 0 5px rgba(91, 122, 98, 0.08); }
    }
    #sl-app .dropzone-title { font-weight: 700; font-size: 0.94rem; letter-spacing: 0.08em; color: var(--sl-text); }

    /* 純視覺化進度指示與錯誤提示 */
    #sl-app .omr-status-bar {
      margin-top: 10px; padding: 10px 14px; border-radius: 8px;
      background: var(--sl-surface-2); border: 1px solid var(--sl-line);
      min-height: 38px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    #sl-app .omr-status-bar.err {
      color: var(--sl-coral); border-color: #dfc3c3; background: var(--sl-coral-bg);
      font-size: 0.8rem;
    }
    #sl-app .omr-visual-loader {
      display: flex; align-items: center; gap: 12px; width: 100%;
    }
    #sl-app .omr-wave {
      display: inline-flex; align-items: center; gap: 3px; height: 18px; flex-shrink: 0;
    }
    #sl-app .omr-wave i {
      display: block; width: 3px; height: 6px; border-radius: 2px;
      background: var(--sl-sage); font-style: normal;
      animation: sl-wave-bar 1.05s ease-in-out infinite;
    }
    #sl-app .omr-wave i:nth-child(2) { animation-delay: 0.14s; }
    #sl-app .omr-wave i:nth-child(3) { animation-delay: 0.28s; }
    #sl-app .omr-wave i:nth-child(4) { animation-delay: 0.42s; }
    #sl-app .omr-wave i:nth-child(5) { animation-delay: 0.56s; }
    @keyframes sl-wave-bar {
      0%, 100% { height: 5px; opacity: 0.4; }
      50% { height: 17px; opacity: 1; }
    }
    #sl-app .omr-track {
      position: relative; flex: 1; height: 6px; border-radius: 999px;
      background: var(--sl-line); overflow: hidden;
    }
    #sl-app .omr-fill {
      position: absolute; top: 0; bottom: 0; left: 0; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sl-sage), #7a9a81, var(--sl-sage));
      background-size: 200% 100%;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      animation: sl-fill-shimmer 1.6s linear infinite;
    }
    #sl-app .omr-track.indeterminate .omr-fill {
      width: 34% !important;
      transition: none;
      animation: sl-indeterminate 1.35s ease-in-out infinite, sl-fill-shimmer 1.6s linear infinite;
    }
    @keyframes sl-fill-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes sl-indeterminate {
      0% { left: -36%; }
      100% { left: 102%; }
    }

    /* 多頁順序確認面板（精準單行對齊排版） */
    #sl-app .queue-panel {
      margin-top: 12px; padding: 14px; border-radius: 8px;
      background: var(--sl-amber-bg); border: 1px solid #dfd0b8;
    }
    #sl-app .queue-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 10px; margin: 12px 0 4px;
    }
    #sl-app .queue-item {
      background: var(--sl-surface); border: 1px solid var(--sl-line-hi); border-radius: 8px; padding: 8px;
      display: flex; flex-direction: column; gap: 8px; cursor: grab; user-select: none; min-width: 0;
    }
    #sl-app .queue-item.dragging { opacity: 0.45; border-color: var(--sl-sage); }
    #sl-app .queue-thumb {
      width: 100%; height: 150px; object-fit: contain; background: #fff;
      border: 1px solid var(--sl-line); border-radius: 4px; display: block;
    }
    #sl-app .queue-foot {
      display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: nowrap;
    }
    #sl-app .queue-badge {
      font-size: 0.72rem; font-weight: 700; color: var(--sl-muted);
      background: var(--sl-surface-2); border: 1px solid var(--sl-line);
      border-radius: 5px; padding: 0 7px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; flex-shrink: 0;
    }
    #sl-app .queue-actions {
      display: inline-flex; align-items: center; gap: 4px; flex-wrap: nowrap; flex-shrink: 0;
    }
    #sl-app .queue-btn {
      width: 26px; min-width: 26px; height: 26px; padding: 0 !important;
      border: 1px solid var(--sl-line-hi); background: var(--sl-surface); color: var(--sl-text);
      border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    #sl-app .queue-btn:hover:not(:disabled) { background: var(--sl-surface-2); }
    #sl-app .queue-btn:disabled { opacity: 0.32; cursor: not-allowed; }
    #sl-app .queue-btn svg { width: 13px; height: 13px; display: block; pointer-events: none; }
    #sl-app .queue-btn-del { color: var(--sl-coral); border-color: #dfc3c3; background: #fdf9f9; }

    /* 我的最愛面板 */
    #sl-app .fav-panel {
      margin-top: 12px; padding: 14px; border-radius: 8px;
      background: var(--sl-rose-bg); border: 1px solid #e2cbcb;
    }
    #sl-app .fav-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 10px;
    }
    #sl-app .fav-card {
      background: var(--sl-surface); border: 1px solid var(--sl-line); border-radius: 8px; padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; color: var(--sl-text);
    }
    #sl-app .fav-card:hover { border-color: var(--sl-rose); }
    #sl-app .fav-card.current { border-color: var(--sl-sage); background: var(--sl-sage-bg); }
    #sl-app .fav-info { min-width: 0; flex: 1; }
    #sl-app .fav-title { font-size: 0.84rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sl-app .fav-sub { font-size: 0.72rem; color: var(--sl-muted); margin-top: 3px; }

    /* 官方譜面畫布盒 */
    #sl-app .sl-score-box {
      height: 72vh; min-height: 420px; display: flex; flex-direction: column;
      border: 1px solid var(--sl-line); border-radius: 8px; background: #e8e3d9; overflow: hidden;
    }
    #sl-app #score-pane {
      flex: 1; min-height: 0; overflow: auto; padding: 16px; background: #e8e3d9;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #sl-app #score-pane.sl-picking {
      cursor: crosshair;
      touch-action: none;
    }

    /* 測驗/圖鑑 五線譜 SVG & 簡譜 */
    #sl-app .staff-quiz-svg { width: 100%; max-width: 310px; height: auto; display: block; color: var(--sl-text); }
    #sl-app .s-ev { transition: color 0.05s, transform 0.05s; }
    #sl-app .s-ev.active-note { color: var(--sl-sage); }

    #sl-app .jianpu-bar {
      display: inline-flex; align-items: center; flex-wrap: nowrap; gap: 12px;
      font-family: var(--sl-serif); font-size: 21px; font-weight: 700; color: var(--sl-text);
      padding: 26px 5px 34px; user-select: none;
    }
    #sl-app .jianpu-bar::before, #sl-app .jianpu-bar::after {
      content: ""; display: inline-block; width: 2px; height: 17px; background: var(--sl-line-hi); align-self: center; flex-shrink: 0;
    }
    #sl-app .j-group-tight { display: inline-flex; align-items: center; gap: 4px; }
    #sl-app .u1 { display: inline-flex; align-items: center; gap: 5px; border-bottom: 2px solid var(--sl-text); padding-bottom: 2px; }
    #sl-app .u2-inner { display: inline-flex; align-items: center; gap: 4px; border-bottom: 2px solid var(--sl-text); padding-bottom: 2px; }
    #sl-app .j-ev { position: relative; display: inline-flex; align-items: center; line-height: 1.05; transition: color 0.05s, transform 0.05s; }
    #sl-app .j-ev.j-rest { color: var(--sl-muted); }
    #sl-app .j-ev.active-note, #sl-app .j-ev .active-note { color: var(--sl-sage) !important; transform: translateY(-2px) scale(1.18); display: inline-block; }
    #sl-app .j-dash { font-weight: 700; margin-left: 3px; color: var(--sl-muted); font-size: 0.88em; transition: color 0.05s, transform 0.05s; }
    #sl-app .j-dot { font-weight: 900; margin-left: 1px; }
    #sl-app .triplet { position: relative; display: inline-flex; align-items: center; }
    #sl-app .triplet::before { content: "3"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--sl-slate); line-height: 1; }
    #sl-app .triplet::after { content: ""; position: absolute; top: -7px; left: 1px; right: 1px; height: 4px; border-top: 1.5px solid var(--sl-slate); border-left: 1.5px solid var(--sl-slate); border-right: 1.5px solid var(--sl-slate); pointer-events: none; }

    /* 響應式斷點 */
    @media (max-width: 768px) {
      body.sl-body { padding: 10px 8px 48px !important; }
      #sl-app .panel { padding: 12px; }
      #sl-app .toolbar-row { padding: 8px 10px; gap: 6px; }
      #sl-app .sl-score-box { height: 64vh; min-height: 360px; }
      #sl-app #score-pane { padding: 10px; }
      #sl-app .queue-grid { grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); }
    }
    @media (max-width: 480px) {
      #sl-app .brand h1 { font-size: 0.9rem; letter-spacing: 0.12em; }
      #sl-app .tab-btn { padding: 0 10px; font-size: 0.78rem; }
      #sl-app .progress-wrap { min-width: 100%; order: 10; }
      #sl-app .queue-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      #sl-app .queue-thumb { height: 124px; }
    }

    #sl-app .hidden { display: none !important; }
  </style>
</head>
<body class="sl-body">
  <div id="sl-app" class="sl-app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-sq"></span>
        <h1>SCORE LAB</h1>
      </div>

      <div class="top-actions">
        <!-- 純 SVG 我的最愛清單按鍵 -->
        <button class="btn btn-icon btn-fav btn-fav-top" id="myBtnFavList" type="button" title="我的最愛" aria-label="我的最愛">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            <path d="M12 13.5l-2.6-2.4a1.6 1.6 0 0 1 2.2-2.3L12 9.2l.4-.4a1.6 1.6 0 0 1 2.2 2.3L12 13.5z" fill="currentColor" stroke="none"/>
          </svg>
        </button>

        <nav class="tabs">
          <button class="tab-btn active" data-tab="analyzer">樂譜</button>
          <button class="tab-btn" data-tab="quiz">測驗</button>
          <button class="tab-btn" data-tab="library">圖鑑</button>
        </nav>
      </div>
    </header>

    <!-- 測驗 / 圖鑑控制列 -->
    <section id="transportPanel" class="panel hidden">
      <div class="row between">
        <div class="row">
          <div class="ctrl-pill">
            <span id="bpmVal" style="color:var(--sl-sage); font-weight:700;">92</span>
            <span>拍速</span>
            <input type="range" id="bpmRange" min="45" max="180" value="92" />
          </div>
          <select id="soundSelect">
            <option value="pluck">鋼琴</option>
            <option value="synth">合成器</option>
            <option value="wood">木魚</option>
          </select>
          <select id="symbolSelect" title="記譜方式">
            <option value="staff">五線譜</option>
            <option value="1">簡譜</option>
            <option value="X">節奏</option>
          </select>
        </div>

        <div class="row">
          <label class="toggle on"><input type="checkbox" id="chkCountIn" checked /><span class="dot"></span>預拍</label>
          <label class="toggle on"><input type="checkbox" id="chkMetro" checked /><span class="dot"></span>節拍</label>
        </div>
      </div>
      <div class="cat-row" id="catBar"></div>
    </section>

    <!-- 測驗 / 圖鑑節拍燈 -->
    <div id="beatStrip" class="beat-strip hidden">
      <span class="beat-status" id="beatStatus">就緒</span>
      <div class="leds" id="beatDots">
        <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
      </div>
    </div>

    <!-- 1. 樂譜區 -->
    <section id="analyzerSection" class="panel">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-title">匯入樂譜</div>
        <div class="row-nowrap">
          <select id="omrKindSelect" title="辨識類型">
            <option value="auto">自動</option>
            <option value="staff">五線譜</option>
            <option value="jianpu">簡譜</option>
          </select>
          <!-- 純 SVG 選擇檔案按鍵 -->
          <button class="btn btn-primary btn-icon" id="btnPickFile" type="button" title="選擇檔案" aria-label="選擇檔案">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </button>
        </div>
        <input type="file" id="scoreInput" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xml,.musicxml,.abc,.123,.jcx,.jly,.jpwabc,.txt,.mid,.midi" class="hidden" />
      </div>

      <!-- 多張圖片先後順序確認 -->
      <div id="multiQueuePanel" class="queue-panel hidden">
        <div class="row between">
          <span style="font-size:0.86rem; font-weight:700; color:var(--sl-text);">確認頁面順序</span>
          <div class="row-nowrap">
            <button class="btn btn-primary btn-xs" id="btnConfirmOrder" type="button">開始辨識</button>
            <button class="btn btn-xs" id="btnCancelOrder" type="button">取消</button>
          </div>
        </div>
        <div class="queue-grid" id="multiQueueGrid"></div>
      </div>

      <!-- 我的最愛面板 -->
      <div id="favPanel" class="fav-panel hidden">
        <div class="row between">
          <span style="font-size:0.86rem; font-weight:700; color:var(--sl-rose);">我的最愛</span>
          <button class="btn btn-xs" id="btnCloseFav" type="button">關閉</button>
        </div>
        <div id="favEmptyHint" style="font-size:0.78rem; color:var(--sl-muted); margin-top:8px;">尚未收藏樂譜</div>
        <div class="fav-grid" id="favGrid"></div>
      </div>

      <!-- 純視覺化進度指示（無文字）與錯誤重試 -->
      <div id="omrStatusBox" class="omr-status-bar hidden" aria-label="處理中">
        <div id="omrVisualLoader" class="omr-visual-loader">
          <span class="omr-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <div id="omrTrack" class="omr-track indeterminate">
            <div id="omrFill" class="omr-fill"></div>
          </div>
        </div>
        <span id="omrStatusText" class="hidden"></span>
        <button class="btn btn-xs hidden" id="btnRetryOmr" type="button">重新辨識</button>
      </div>

      <!-- 樂譜主輸出區：三行色彩分組工具列 + 可展開修譜面板 + 官方動態譜面 -->
      <div id="analyzerOutput" class="hidden" style="margin-top:14px;">
        <div class="toolbar-stack">
          <!-- 第 1 行：播放與純 SVG 控制列（莫蘭迪鼠尾草綠） -->
          <div class="toolbar-row row-play">
            <div class="row-nowrap">
              <button class="btn btn-xs btn-play-main" id="myBtnPlay" type="button">
                <span class="playback-icon"></span>
                <span class="playback-label">播放</span>
              </button>
              <button class="btn btn-xs" id="myBtnStop" type="button">停止</button>
            </div>
            <div class="progress-wrap">
              <input type="range" id="myProgress" />
              <span class="mono-tag" id="myTime">0:00 / 0:00</span>
            </div>
            <div class="row-nowrap">
              <select id="mySpeed"></select>
              <!-- 循環（純 SVG） -->
              <button class="btn btn-icon" id="myBtnLoop" type="button" title="循環" aria-label="循環">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"/>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                  <polyline points="7 23 3 19 7 15"/>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
              </button>
              <!-- 節拍（純 SVG） -->
              <button class="btn btn-icon" id="myBtnMetro" type="button" title="節拍" aria-label="節拍">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 20h10l-2.5-15h-5L7 20z"/>
                  <line x1="12" y1="16" x2="18" y2="6"/>
                  <circle cx="16.2" cy="8.8" r="1.4" fill="currentColor" stroke="none"/>
                  <line x1="5" y1="20" x2="19" y2="20"/>
                </svg>
              </button>
              <!-- 選段（純 SVG：長按起點拖曳至終點） -->
              <button class="btn btn-icon btn-range" id="myBtnRangeMode" type="button" title="選段：於樂譜長按起點拖曳至終點（或點擊此鍵後直接拖曳）" aria-label="選段">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 4H5v16h3"/>
                  <path d="M16 4h3v16h-3"/>
                  <line x1="9" y1="12" x2="15" y2="12"/>
                  <circle cx="9" cy="12" r="1.6" fill="currentColor" stroke="none"/>
                  <circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/>
                </svg>
              </button>
              <!-- 清除選段（純 SVG） -->
              <button class="btn btn-icon btn-range-clear hidden" id="myBtnRangeClear" type="button" title="清除選段" aria-label="清除選段">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 4H4v16h3"/>
                  <path d="M17 4h3v16h-3"/>

          <!-- 第 2 行：譜面視圖（莫蘭迪霧霾藍）＋ 右側修譜模式開關 -->
          <div class="toolbar-row row-view" id="myViewSwitch">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <button class="btn btn-icon" id="myBtnZoomIn" type="button" title="放大" aria-label="放大">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="7"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  <line x1="11" y1="8" x2="11" y2="14"/>

              <!-- 上一頁 SVG -->
              <button class="btn btn-icon" id="myBtnPrevPage" type="button" title="上一頁" aria-label="上一頁">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"/>

              <!-- 下一頁 SVG -->
              <button class="btn btn-icon" id="myBtnNextPage" type="button" title="下一頁" aria-label="下一頁">

                  <polyline points="9 18 15 12 9 6"/>

            <div class="row-nowrap">

              <button class="btn btn-icon btn-export" id="myBtnExportXml" type="button" title="匯出樂譜" aria-label="匯出樂譜">

                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>

              <!-- 我的最愛 SVG -->

                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

        <!-- 可展開修譜面板（點「修譜」才顯示，掛載原版 VisualEditController 面板與拍數檢查） -->
        <div id="editPanel" class="edit-panel hidden">
          <div class="edit-bar">

            <div class="row-nowrap">
              <button class="btn btn-xs" id="btn-beat-check" type="button" title="顯示拍數檢查紅框">對拍</button>
              <button class="btn btn-xs" id="btn-format-marks" type="button" title="顯示換行與換頁記號">換行</button>
              <button class="btn btn-xs" id="btn-palette" type="button" title="收合/展開修譜按鈕面板">面板</button>

        <div class="sl-score-box">
          <div id="score-pane"></div>

        <div id="code-pane-hidden" style="display:none;"></div>
      </div>
    </section>

    <!-- 2. 測驗 -->
    <section id="quizSection" class="panel hidden">
      <div class="row between" style="margin-bottom:12px;">
        <div class="row">
          <button class="btn btn-primary" id="btnPlayQuestion">播放</button>
          <button class="btn" id="btnStopAudio">停止</button>
          <button class="btn" id="btnNextQuestion">換題</button>
        </div>
        <div class="row">
          <span class="mono-tag">答對 <b id="statCorrect">0</b>/<b id="statTotal">0</b></span>
          <span class="mono-tag">連勝 <b id="statStreak">0</b></span>

        <span id="feedbackText"></span>
        <button class="btn btn-primary btn-xs" id="btnBannerNext">下一題</button>

    <!-- 3. 圖鑑 -->
    <section id="librarySection" class="panel hidden">
      <div class="row between" style="margin-bottom:12px;">
        <span class="mono-tag">節奏圖鑑</span>
        <button class="btn btn-xs" id="btnLibStop">停止</button>
      </div>
      <div class="grid-2" id="libraryList"></div>

  <script>
    // ==========================================
    // 1. IndexedDB + localStorage 持久化設定與最愛
    // ==========================================
    const FAV_DB_NAME = 'scorelab_favorites_db';
    const FAV_STORE = 'scores';
    const FAV_META_LS = 'scorelab_favorites_meta_v1';
    const NOTATION_LS = 'scorelab_quiz_notation_v1';
    const VIEW_LABEL = { staff: '五線譜', mixed: '混排', expanded: '簡譜', original: '簡譜' };

    const RANGE_SVG_IDLE = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4H5v16h3"/>
        <path d="M16 4h3v16h-3"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <circle cx="9" cy="12" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/>
      </svg>`;
    const RANGE_SVG_DRAG = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4H5v16h3"/>
        <path d="M16 4h3v16h-3"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
        <polyline points="13 9 16 12 13 15"/>
      </svg>`;

    // 載入記譜偏好（預設為五線譜）
    try {
      const savedNotation = localStorage.getItem(NOTATION_LS);
      const sel = document.getElementById('symbolSelect');
      if (savedNotation && ['staff', '1', 'X'].includes(savedNotation)) {
        sel.value = savedNotation;
      } else {
        sel.value = 'staff';
      }
    } catch {}

    function openFavDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(FAV_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(FAV_STORE)) {
            db.createObjectStore(FAV_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllFavorites() {
      const db = await openFavDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FAV_STORE, 'readonly');
        const req = tx.objectStore(FAV_STORE).getAll();
        req.onsuccess = () => {
          const list = (req.result || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          try {
            localStorage.setItem(FAV_META_LS, JSON.stringify(list.map(x => ({ id: x.id, hash: x.hash, title: x.title, viewMode: x.viewMode, createdAt: x.createdAt }))));
          } catch {}
          resolve(list);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function putFavorite(record) {
      const db = await openFavDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FAV_STORE, 'readwrite');
        tx.objectStore(FAV_STORE).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteFavorite(id) {
      const db = await openFavDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FAV_STORE, 'readwrite');
        tx.objectStore(FAV_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function hashSnapshot(format, text) {
      let h = 2166136261;
      const str = `${format}:${text}`;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return `${format}:${str.length}:${(h >>> 0).toString(36)}`;
    }

    let currentFavHash = null;

    async function syncFavToggleButton() {
      const btn = document.getElementById('myBtnFavToggle');
      const snap = window.__dolceEngine?.getSnapshot();
      if (!snap) {
        currentFavHash = null;
        btn.classList.remove('fav-saved');
        btn.querySelector('path').setAttribute('fill', 'none');
        return;
      }
      currentFavHash = hashSnapshot(snap.format, snap.text);
      const list = await getAllFavorites();
      const hit = list.some(x => x.hash === currentFavHash);
      btn.classList.toggle('fav-saved', hit);
      btn.querySelector('path').setAttribute('fill', hit ? 'currentColor' : 'none');
    }

    async function renderFavoritesPanel() {
      const list = await getAllFavorites();
      const grid = document.getElementById('favGrid');
      const empty = document.getElementById('favEmptyHint');
      grid.innerHTML = '';
      empty.classList.toggle('hidden', list.length > 0);

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'fav-card' + (item.hash === currentFavHash ? ' current' : '');

        const info = document.createElement('div');
        info.className = 'fav-info';
        const d = new Date(item.createdAt || Date.now());
        const dt = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        info.innerHTML = `<div class="fav-title"></div><div class="fav-sub">${VIEW_LABEL[item.viewMode] || '樂譜'} · ${dt}</div>`;
        info.querySelector('.fav-title').textContent = item.title || '已儲存樂譜';

        const actions = document.createElement('div');
        actions.className = 'row-nowrap';

        const btnRename = document.createElement('button');
        btnRename.type = 'button';
        btnRename.className = 'btn btn-xs btn-icon';
        btnRename.title = '重新命名';
        btnRename.setAttribute('aria-label', '重新命名');
        btnRename.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
        btnRename.addEventListener('click', async (e) => {
          e.stopPropagation();
          const next = prompt('修改樂譜名稱：', item.title || '已儲存樂譜');
          if (next && next.trim()) {
            item.title = next.trim();
            await putFavorite(item);
            await renderFavoritesPanel();
          }
        });

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn btn-xs btn-icon';
        btnDel.title = '移除';
        btnDel.setAttribute('aria-label', '移除');
        btnDel.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>`;
        btnDel.addEventListener('click', async (e) => {
          e.stopPropagation();
          await deleteFavorite(item.id);
          await syncFavToggleButton();
          await renderFavoritesPanel();
        });

        actions.append(btnRename, btnDel);
        card.append(info, actions);

        card.addEventListener('click', async () => {
          hideOmrStatus();
          try {
            const eng = await ensureDolceEngine();
            await eng.loadSnapshot(item);
            document.getElementById('analyzerOutput').classList.remove('hidden');
            document.getElementById('favPanel').classList.add('hidden');
            document.getElementById('myBtnFavList').classList.remove('fav-open');
            await syncFavToggleButton();
            await renderFavoritesPanel();
          } catch (err) {
            console.error(err);
            setOmrError(`載入失敗：${err?.message || err}`);
          }
        });

        grid.appendChild(card);
      });
    }

    // ==========================================
    // 2. 樂譜區：多頁順序確認 & 純視覺進度辨識
    // ==========================================
    let lastOmrFiles = [];
    let pendingQueue = [];
    let dragIndex = -1;
    let enginePromise = null;

    function hideOmrStatus() {
      document.getElementById('dropzone').classList.remove('processing');
      document.getElementById('omrStatusBox').classList.add('hidden');
      document.getElementById('omrStatusText').classList.add('hidden');
      document.getElementById('btnRetryOmr').classList.add('hidden');
    }

    function setOmrProgress(ratio = null) {
      const dz = document.getElementById('dropzone');
      const box = document.getElementById('omrStatusBox');
      const loader = document.getElementById('omrVisualLoader');
      const track = document.getElementById('omrTrack');
      const fill = document.getElementById('omrFill');
      const txt = document.getElementById('omrStatusText');
      const retry = document.getElementById('btnRetryOmr');

      dz.classList.add('processing');
      box.className = 'omr-status-bar';
      loader.classList.remove('hidden');
      txt.textContent = '';
      txt.classList.add('hidden');
      retry.classList.add('hidden');

      if (typeof ratio === 'number' && Number.isFinite(ratio)) {
        const pct = Math.max(6, Math.min(100, Math.round(ratio * 100)));
        track.classList.remove('indeterminate');
        fill.style.width = `${pct}%`;
      } else {
        track.classList.add('indeterminate');
      }
    }

    function setOmrError(msg) {
      const dz = document.getElementById('dropzone');
      const box = document.getElementById('omrStatusBox');
      const loader = document.getElementById('omrVisualLoader');
      const txt = document.getElementById('omrStatusText');
      const retry = document.getElementById('btnRetryOmr');

      dz.classList.remove('processing');
      box.className = 'omr-status-bar err';
      loader.classList.add('hidden');
      txt.textContent = msg;
      txt.classList.remove('hidden');

      const isOmr = lastOmrFiles.length > 0 && lastOmrFiles.every(f => /\.(pdf|png|jpe?g|webp)$/i.test(f.name) || f.type.startsWith('image/'));
      retry.classList.toggle('hidden', !isOmr);
    }

    function clearPendingQueue() {
      pendingQueue.forEach(item => { try { URL.revokeObjectURL(item.url); } catch {} });
      pendingQueue = [];
      document.getElementById('multiQueuePanel').classList.add('hidden');
      document.getElementById('multiQueueGrid').innerHTML = '';
    }

    function renderMultiQueue() {
      const grid = document.getElementById('multiQueueGrid');
      grid.innerHTML = '';
      pendingQueue.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'queue-item';
        card.draggable = true;

        card.addEventListener('dragstart', () => { dragIndex = idx; card.classList.add('dragging'); });
        card.addEventListener('dragend', () => { dragIndex = -1; card.classList.remove('dragging'); });
        card.addEventListener('dragover', (e) => e.preventDefault());
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          if (dragIndex >= 0 && dragIndex !== idx) {
            const [moved] = pendingQueue.splice(dragIndex, 1);
            pendingQueue.splice(idx, 0, moved);
            renderMultiQueue();
          }
        });

        const img = document.createElement('img');
        img.className = 'queue-thumb';
        img.src = item.url;
        img.alt = `第 ${idx + 1} 頁`;

        const foot = document.createElement('div');
        foot.className = 'queue-foot';

        const badge = document.createElement('span');
        badge.className = 'queue-badge';
        badge.textContent = `第 ${idx + 1} 頁`;

        const btns = document.createElement('div');
        btns.className = 'queue-actions';

        const up = document.createElement('button');
        up.type = 'button'; up.className = 'queue-btn'; up.disabled = idx === 0;
        up.title = '往前移一頁'; up.setAttribute('aria-label', '往前移一頁');
        up.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
        up.addEventListener('click', () => {
          [pendingQueue[idx - 1], pendingQueue[idx]] = [pendingQueue[idx], pendingQueue[idx - 1]];
          renderMultiQueue();
        });

        const down = document.createElement('button');
        down.type = 'button'; down.className = 'queue-btn'; down.disabled = idx === pendingQueue.length - 1;
        down.title = '往後移一頁'; down.setAttribute('aria-label', '往後移一頁');
        down.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
        down.addEventListener('click', () => {
          [pendingQueue[idx + 1], pendingQueue[idx]] = [pendingQueue[idx], pendingQueue[idx + 1]];
          renderMultiQueue();
        });

        const del = document.createElement('button');
        del.type = 'button'; del.className = 'queue-btn queue-btn-del';
        del.title = '移除此頁'; del.setAttribute('aria-label', '移除此頁');
        del.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
        del.addEventListener('click', () => {
          const [removed] = pendingQueue.splice(idx, 1);
          try { URL.revokeObjectURL(removed.url); } catch {}
          if (pendingQueue.length === 0) clearPendingQueue();
          else renderMultiQueue();
        });

        btns.append(up, down, del);
        foot.append(badge, btns);
        card.append(img, foot);
        grid.appendChild(card);
      });
    }

    function handlePickedFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;
      if (files.length === 1) {
        clearPendingQueue();
        void loadScoreFiles([files[0]]);
        return;
      }
      const images = files
        .filter(f => /\.(png|jpe?g|webp)$/i.test(f.name) || f.type.startsWith('image/'))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      if (images.length === 0) {
        clearPendingQueue();
        void loadScoreFiles([files[0]]);
        return;
      }
      if (images.length === 1) {
        clearPendingQueue();
        void loadScoreFiles([images[0]]);
        return;
      }
      clearPendingQueue();
      pendingQueue = images.map(file => ({ file, url: URL.createObjectURL(file) }));
      document.getElementById('multiQueuePanel').classList.remove('hidden');
      renderMultiQueue();
    }

    function ensureDolceEngine() {
      if (enginePromise) return enginePromise;
      enginePromise = (async () => {
        if (!window.__dolceEngine) {
          await new Promise((resolve) => window.addEventListener('dolce-engine-ready', resolve, { once: true }));
        }
        const scorePane = document.getElementById('score-pane');
        const zoomBtn = document.getElementById('myBtnZoomReset');
        const rangeBtn = document.getElementById('myBtnRangeMode');
        const clearBtn = document.getElementById('myBtnRangeClear');
        const viewBtns = new Map([
          ['staff', document.getElementById('myViewStaff')],
          ['mixed', document.getElementById('myViewMixed')],
          ['expanded', document.getElementById('myViewExpanded')],
        ]);
        await window.__dolceEngine.mount({
          scorePane,
          hiddenCodePane: document.getElementById('code-pane-hidden'),
          statusEl: document.getElementById('editStatusText'),
          playBtn: document.getElementById('myBtnPlay'),
          stopBtn: document.getElementById('myBtnStop'),
          progressEl: document.getElementById('myProgress'),
          timeEl: document.getElementById('myTime'),
          speedSel: document.getElementById('mySpeed'),
          loopBtn: document.getElementById('myBtnLoop'),
          metroBtn: document.getElementById('myBtnMetro'),
          viewSwitch: document.getElementById('myViewSwitch'),
          viewBtns,
          editToggleBtn: document.getElementById('myBtnEditMode'),
          editPanel: document.getElementById('editPanel'),
          visualEls: {
            mode: document.getElementById('visual-mode'),
            selInfo: document.getElementById('sel-info'),
            marksBtn: document.getElementById('btn-format-marks'),
            beatBtn: document.getElementById('btn-beat-check'),
            beatCount: document.getElementById('beat-count'),
            palette: document.getElementById('visual-palette'),
            paletteBtn: document.getElementById('btn-palette'),
          },
          onZoomChange: (z) => {
            if (zoomBtn) zoomBtn.textContent = `${Math.round(z * 100)}%`;
          },
          onRangeChange: ({ active, picking, hasStart }) => {
            scorePane.classList.toggle('sl-picking', picking);
            rangeBtn.classList.toggle('picking', picking);
            rangeBtn.classList.toggle('has-start', picking && hasStart);
            rangeBtn.classList.toggle('active', active && !picking);
            if (picking) {
              rangeBtn.innerHTML = RANGE_SVG_DRAG;
              const label = hasStart ? '拖曳至終點音符後放開即可完成選段' : '請於樂譜按住起點並拖曳至終點';
              rangeBtn.title = label;
              rangeBtn.setAttribute('aria-label', label);
            } else {
              rangeBtn.innerHTML = RANGE_SVG_IDLE;
              const label = active
                ? '選段反覆中（長按起點拖曳或點此鍵重新選段）'
                : '選段：長按起點拖曳至終點（或點擊此鍵後直接拖曳）';
              rangeBtn.title = label;
              rangeBtn.setAttribute('aria-label', label);
            }
            clearBtn.classList.toggle('hidden', !active && !hasStart);
          },
        });
        return window.__dolceEngine;
      })();
      return enginePromise;
    }
