    // MIDI -> MusicXML
    function parseMIDI(arrayBuffer) {
      const dv = new DataView(arrayBuffer); let pos = 0;
      const readStr = (len) => { let s = ''; for (let i = 0; i < len; i++) s += String.fromCharCode(dv.getUint8(pos++)); return s; };
      const readVLQ = () => {
        let val = 0;
        while (pos < dv.byteLength) { const b = dv.getUint8(pos++); val = (val << 7) | (b & 0x7f); if ((b & 0x80) === 0) break; }
        return val;
      };
      if (readStr(4) !== 'MThd') throw new Error('無效的 MIDI 格式');
      const hdrLen = dv.getUint32(pos); pos += 4; pos += 2;
      const numTracks = dv.getUint16(pos); pos += 2;
      const division = dv.getUint16(pos); pos += 2;
      if (hdrLen > 6) pos += (hdrLen - 6);

      const tempoMap = [{ tick: 0, bpm: 100 }], timeSigMap = [{ tick: 0, num: 4, den: 4 }], keySigMap = [{ tick: 0, sf: 0, mi: 0 }];
      const rawTracks = [];

      for (let t = 0; t < numTracks; t++) {
        if (pos + 8 > dv.byteLength) break;
        const tag = readStr(4), trkLen = dv.getUint32(pos); pos += 4;
        const trkEnd = Math.min(dv.byteLength, pos + trkLen);
        if (tag !== 'MTrk') { pos = trkEnd; continue; }
        let tick = 0, runningStatus = 0;
        const activeNotes = new Map(), notes = [];

        while (pos < trkEnd) {
          tick += readVLQ(); if (pos >= trkEnd) break;
          let status = dv.getUint8(pos);
          if (status < 0x80) status = runningStatus;
          else { pos++; if (status < 0xf0) runningStatus = status; }

          if (status === 0xff) {
            const metaType = dv.getUint8(pos++), len = readVLQ();
            if (metaType === 0x51 && len === 3) {
              const us = (dv.getUint8(pos) << 16) | (dv.getUint8(pos + 1) << 8) | dv.getUint8(pos + 2);
              tempoMap.push({ tick, bpm: Math.round(60000000 / us) });
            } else if (metaType === 0x58 && len >= 2) {
              timeSigMap.push({ tick, num: dv.getUint8(pos), den: Math.pow(2, dv.getUint8(pos + 1)) });
            } else if (metaType === 0x59 && len >= 2) {
              keySigMap.push({ tick, sf: dv.getInt8(pos), mi: dv.getUint8(pos + 1) });
            }
            pos += len;
          } else if (status === 0xf0 || status === 0xf7) {
            pos += readVLQ();
          } else {
            const type = status & 0xf0, ch = status & 0x0f, d1 = dv.getUint8(pos++);
            const d2 = (type === 0xc0 || type === 0xd0) ? 0 : dv.getUint8(pos++);
            if (type === 0x90 && d2 > 0) {
              const k = (ch << 8) | d1; if (!activeNotes.has(k)) activeNotes.set(k, []); activeNotes.get(k).push(tick);
            } else if (type === 0x80 || (type === 0x90 && d2 === 0)) {
              const k = (ch << 8) | d1, q = activeNotes.get(k);
              if (q && q.length > 0) {
                const startTick = q.shift();
                notes.push({ startTick, durTicks: Math.max(division * 0.25, tick - startTick), midi: d1 });
              }
            }
          }
        }
        pos = trkEnd;
        if (notes.length > 0) rawTracks.push({ short: `T${rawTracks.length + 1}`, notes });
      }
      if (rawTracks.length === 0) throw new Error('沒有偵測到音符');
      tempoMap.sort((a, b) => a.tick - b.tick); timeSigMap.sort((a, b) => a.tick - b.tick); keySigMap.sort((a, b) => a.tick - b.tick);
      const getAt = (arr, tick) => { let cur = arr[0]; for (const item of arr) { if (item.tick <= tick + 10) cur = item; else break; } return cur; };

      let maxTick = 0;
      for (const rt of rawTracks) for (const nt of rt.notes) maxTick = Math.max(maxTick, nt.startTick + nt.durTicks);
      const tol = division * 0.08, combinedBars = [];
      let barTick = 0, barIdx = 0;

      while (barTick < maxTick && barIdx < 500) {
        const ts = getAt(timeSigMap, barTick), ks = getAt(keySigMap, barTick);
        const barBeats = ts.num * (4 / ts.den), barTicks = barBeats * division;
        const voices = rawTracks.map(rt => {
          const inBar = rt.notes
            .filter(n => n.startTick >= barTick - tol && n.startTick < barTick + barTicks - tol)
            .map(n => ({ start: (n.startTick - barTick) / division, dur: n.durTicks / division, midis: [n.midi] }));
          return { label: rt.short, events: normalizePolyBarEvents(inBar, barBeats) };
        });
        if (voices.some(v => v.events.some(e => e.type === 'note')) || barIdx === 0) {
          combinedBars.push({ barBeats, timeSig: `${ts.num}/${ts.den}`, keyFifths: ks.sf, voices });
        }
        barTick += barTicks; barIdx++;
      }
      const initBpm = tempoMap.find(x => x.tick === 0)?.bpm || tempoMap[1]?.bpm || 100;
      return { bpm: initBpm, trackViews: [{ bars: combinedBars }] };
    }

    function normalizePolyBarEvents(rawNotes, barBeats) {
      const grid16 = 0.25, gridTri = 1 / 3;
      const quantize = (val) => {
        const q16 = Math.round(val / grid16) * grid16, qTri = Math.round(val / gridTri) * gridTri;
        return Math.abs(val - qTri) + 0.01 < Math.abs(val - q16) ? qTri : q16;
      };
      const cleaned = rawNotes
        .map(x => ({ start: Math.max(0, quantize(x.start)), dur: Math.max(0.25, quantize(x.dur)), midis: [...x.midis] }))
        .filter(x => x.start < barBeats - 0.05)
        .sort((a, b) => a.start - b.start);
      const grouped = [];
      cleaned.forEach(item => {
        const prev = grouped[grouped.length - 1];
        if (prev && Math.abs(prev.start - item.start) < 0.06) {
          item.midis.forEach(m => { if (!prev.midis.includes(m)) prev.midis.push(m); });
          if (item.dur > prev.dur) prev.dur = item.dur;
        } else grouped.push(item);
      });
      const result = [];
      let cursor = 0;
      const pushRests = (start, totalDur) => {
        let cur = start, rem = totalDur;
        while (rem > 0.06) {
          const toBeat = Math.floor(cur + 0.02) + 1 - cur;
          let chunk = rem;
          if (rem > toBeat + 0.05 && Math.abs(cur - Math.floor(cur)) > 0.05) chunk = toBeat;
          else if (chunk > 2) chunk = 2;
          else if (chunk > 1 && chunk < 1.95) chunk = 1;
          result.push({ start: cur, dur: chunk, type: 'rest' });
          cur += chunk; rem -= chunk;
        }
      };
      grouped.forEach(note => {
        if (note.start > cursor + 0.06) { pushRests(cursor, note.start - cursor); cursor = note.start; }
        const avail = Math.min(note.dur, barBeats - cursor);
        if (avail >= 0.2) { result.push({ start: cursor, dur: avail, type: 'note', midis: note.midis }); cursor += avail; }
      });
      if (cursor < barBeats - 0.06) pushRests(cursor, barBeats - cursor);
      return result;
    }

    function exportScoreToMusicXML(bars, bpm = 92) {
      const divs = 12;
      const sharpSpell = [['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
      const flatSpell  = [['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
      const numVoices = Math.max(1, bars[0]?.voices?.length || 1);
      const kf = bars[0]?.keyFifths || 0;
      let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<score-partwise version="3.1">\n  <part-list><score-part id="P1"><part-name>Score</part-name></score-part></part-list>\n  <part id="P1">\n`;
      bars.forEach((bar, bIdx) => {
        const [bts, btp] = (bar.timeSig || '4/4').split('/');
        xml += `    <measure number="${bIdx + 1}">\n`;
        if (bIdx === 0) {
          xml += `      <attributes><divisions>${divs}</divisions><key><fifths>${kf}</fifths></key><time><beats>${bts}</beats><beat-type>${btp}</beat-type></time><staves>${numVoices > 1 ? 2 : 1}</staves></attributes>\n`;
          xml += `      <sound tempo="${bpm}"/>\n`;
        }
        const barDivs = Math.round((bar.barBeats || 4) * divs);
        (bar.voices || []).forEach((v, vIdx) => {
          if (vIdx > 0) xml += `      <backup><duration>${barDivs}</duration></backup>\n`;
          const staff = vIdx === 0 ? 1 : 2;
          v.events.forEach(ev => {
            const durDivs = Math.max(1, Math.round(ev.dur * divs));
            if (ev.type === 'rest') {
              xml += `      <note><rest/><duration>${durDivs}</duration><voice>${vIdx + 1}</voice><staff>${staff}</staff></note>\n`;
            } else {
              (ev.midis && ev.midis.length ? ev.midis : [60]).forEach((m, mi) => {
                const oct = Math.floor(m / 12) - 1;
                const [step, alter] = (kf < 0 ? flatSpell : sharpSpell)[((m % 12) + 12) % 12];
                xml += `      <note>${mi > 0 ? '<chord/>' : ''}<pitch><step>${step}</step>${alter ? `<alter>${alter}</alter>` : ''}<octave>${oct}</octave></pitch><duration>${durDivs}</duration><voice>${vIdx + 1}</voice><staff>${staff}</staff></note>\n`;
              });
            }
          });
        });
        xml += `    </measure>\n`;
      });
      xml += `  </part>\n</score-partwise>`;
      return xml;
    }

    // ==========================================
    // 3. 測驗與圖鑑（支援五線譜 / 簡譜 / 節奏）
    // ==========================================
    const CATEGORIES = { basic: '基礎', syncopation: '切分', sixteenth: '十六分', dotted: '附點', offbeat: '反拍' };
    const n = (dur) => ({ t: 'n', dur });
    const r = (dur) => ({ t: 'r', dur });
    const half = () => ({ t: 'half', dur: 2 });
    const dotQ = () => ({ t: 'dotQ', dur: 1.5 });
    const dot8 = () => ({ t: 'dot8', dur: 0.75 });
    const u1 = (...items) => ({ t: 'u1', items });
    const u2 = (...items) => ({ t: 'u2', items });
    const sync = (...items) => ({ t: 'sync', items });
    const tri = () => ({ t: 'tri', items: [n(1/3), n(1/3), n(1/3)] });

    const PATTERNS = [
      { id: 'b1', cat: 'basic', name: '四分基本', groups: [n(1), n(1), n(1), n(1)] },
      { id: 'b2', cat: 'basic', name: '二分加四分', groups: [half(), n(1), n(1)] },
      { id: 'b3', cat: 'basic', name: '前八後四', groups: [u1(n(0.5), n(0.5)), n(1), u1(n(0.5), n(0.5)), n(1)] },
      { id: 'b4', cat: 'basic', name: '前四後八', groups: [n(1), u1(n(0.5), n(0.5)), n(1), u1(n(0.5), n(0.5))] },
      { id: 'b5', cat: 'basic', name: '八分加休止', groups: [u1(n(0.5), n(0.5)), u1(n(0.5), n(0.5)), n(1), r(1)] },
      { id: 's1', cat: 'syncopation', name: '前小切分', groups: [sync(u1(n(0.5)), n(1), u1(n(0.5))), n(1), n(1)] },
      { id: 's2', cat: 'syncopation', name: '後小切分', groups: [n(1), n(1), sync(u1(n(0.5)), n(1), u1(n(0.5)))] },
      { id: 's3', cat: 'syncopation', name: '雙小切分', groups: [sync(u1(n(0.5)), n(1), u1(n(0.5))), sync(u1(n(0.5)), n(1), u1(n(0.5)))] },
      { id: 's4', cat: 'syncopation', name: '置中小切分', groups: [n(1), sync(u1(n(0.5)), n(1), u1(n(0.5))), n(1)] },
      { id: 's5', cat: 'syncopation', name: '大切分', groups: [n(1), half(), n(1)] },
      { id: 's6', cat: 'syncopation', name: '大切分加八分', groups: [n(1), half(), u1(n(0.5), n(0.5))] },
      { id: 'x1', cat: 'sixteenth', name: '十六分切分', groups: [n(1), u1(u2(n(0.25)), n(0.5), u2(n(0.25))), n(1), n(1)] },
      { id: 'x2', cat: 'sixteenth', name: '雙十六分切分', groups: [u1(u2(n(0.25)), n(0.5), u2(n(0.25))), n(1), u1(u2(n(0.25)), n(0.5), u2(n(0.25))), n(1)] },
      { id: 'x3', cat: 'sixteenth', name: '前八後十六', groups: [n(1), u1(n(0.5), u2(n(0.25), n(0.25))), n(1), u1(n(0.5), u2(n(0.25), n(0.25)))] },
      { id: 'x4', cat: 'sixteenth', name: '前十六後八', groups: [n(1), u1(u2(n(0.25), n(0.25)), n(0.5)), n(1), u1(u2(n(0.25), n(0.25)), n(0.5))] },
      { id: 'x5', cat: 'sixteenth', name: '十六分加切分', groups: [u1(u2(n(0.25), n(0.25), n(0.25), n(0.25))), sync(u1(n(0.5)), n(1), u1(n(0.5))), n(1)] },
      { id: 'd1', cat: 'dotted', name: '大附點', groups: [sync(dotQ(), u1(n(0.5))), n(1), n(1)] },
      { id: 'd2', cat: 'dotted', name: '雙大附點', groups: [sync(dotQ(), u1(n(0.5))), sync(dotQ(), u1(n(0.5)))] },
      { id: 'd3', cat: 'dotted', name: '反大附點', groups: [sync(u1(n(0.5)), dotQ()), n(1), n(1)] },
      { id: 'd4', cat: 'dotted', name: '小附點', groups: [n(1), u1(dot8(), u2(n(0.25))), n(1), u1(dot8(), u2(n(0.25)))] },
      { id: 'd5', cat: 'dotted', name: '反小附點', groups: [n(1), u1(u2(n(0.25)), dot8()), n(1), u1(u2(n(0.25)), dot8())] },
      { id: 'o1', cat: 'offbeat', name: '連續反拍', groups: [u1(r(0.5), n(0.5)), u1(r(0.5), n(0.5)), u1(r(0.5), n(0.5)), u1(r(0.5), n(0.5))] },
      { id: 'o2', cat: 'offbeat', name: '正反交替', groups: [n(1), u1(r(0.5), n(0.5)), n(1), u1(r(0.5), n(0.5))] },
      { id: 'o3', cat: 'offbeat', name: '反拍起手', groups: [u1(r(0.5), n(0.5)), n(1), u1(n(0.5), n(0.5)), n(1)] },
      { id: 'o4', cat: 'offbeat', name: '三連音', groups: [n(1), tri(), n(1), n(1)] },
      { id: 'o5', cat: 'offbeat', name: '三連加八分', groups: [tri(), u1(n(0.5), n(0.5)), tri(), n(1)] }
    ];

    function compileBuiltInJianpu(pattern, symMode = '1', barIdx = 0) {
      const events = [];
      let cursor = 0;
      const ch = symMode === 'X' ? 'X' : '1';
      function walk(tok) {
        if (tok.t === 'n') { const idx = events.length; events.push({ start: cursor, dur: tok.dur, type: 'note', midis: [60] }); cursor += tok.dur; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}</span>`; }
        if (tok.t === 'r') { const idx = events.length; events.push({ start: cursor, dur: tok.dur, type: 'rest' }); cursor += tok.dur; return `<span class="j-ev j-rest" data-bar="${barIdx}" data-v="0" data-ev="${idx}">0</span>`; }
        if (tok.t === 'half') { const idx = events.length; events.push({ start: cursor, dur: 2, type: 'note', midis: [60], hasDash: true }); cursor += 2; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}" data-half="1"><span class="j-main">${ch}</span><span class="j-dash">-</span></span>`; }
        if (tok.t === 'dotQ') { const idx = events.length; events.push({ start: cursor, dur: 1.5, type: 'note', midis: [60] }); cursor += 1.5; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}<span class="j-dot">·</span></span>`; }
        if (tok.t === 'dot8') { const idx = events.length; events.push({ start: cursor, dur: 0.75, type: 'note', midis: [60] }); cursor += 0.75; return `<span class="j-ev" data-bar="${barIdx}" data-v="0" data-ev="${idx}">${ch}<span class="j-dot">·</span></span>`; }
        if (tok.t === 'u1') return `<span class="u1">${tok.items.map(walk).join('')}</span>`;
        if (tok.t === 'u2') return `<span class="u2-inner">${tok.items.map(walk).join('')}</span>`;
        if (tok.t === 'sync') return `<span class="j-group-tight">${tok.items.map(walk).join('')}</span>`;
        if (tok.t === 'tri') return `<span class="triplet"><span class="u1">${tok.items.map(walk).join('')}</span></span>`;
        return '';
      }
      return { html: `<div class="jianpu-bar">${pattern.groups.map(walk).join('')}</div>`, events, barBeats: 4 };
    }

    // 內建 4/4 五線譜 SVG 渲染器（測驗與圖鑑用）
    function compileBuiltInStaff(pattern, barIdx = 0) {
      const events = [];
      const u1Groups = [];
      const u2Groups = [];
      const triGroups = [];
      let cursor = 0;

      function walk(tok, ctx) {
        if (tok.t === 'n' || tok.t === 'half' || tok.t === 'dotQ' || tok.t === 'dot8') {
          const dur = tok.t === 'half' ? 2 : tok.t === 'dotQ' ? 1.5 : tok.t === 'dot8' ? 0.75 : tok.dur;
          const idx = events.length;
          const item = {
            idx, start: cursor, dur, type: 'note',
            hollow: tok.t === 'half',
            dotted: tok.t === 'dotQ' || tok.t === 'dot8',
            inU1: ctx.inU1,
            inU2: ctx.inU2,
            isEighthAlone: ctx.isEighthAlone,
          };
          events.push(item);
          if (ctx.u1Arr) ctx.u1Arr.push(item);
          if (ctx.u2Arr) ctx.u2Arr.push(item);
          if (ctx.triArr) ctx.triArr.push(item);
          cursor += dur;
          return;
        }
        if (tok.t === 'r') {
          const idx = events.length;
          events.push({ idx, start: cursor, dur: tok.dur, type: 'rest', inU1: ctx.inU1 });
          cursor += tok.dur;
          return;
        }
        if (tok.t === 'u1') {
          const notesInU1 = [];
          const hasOnlyOneNote = tok.items.filter(it => it.t !== 'r').length <= 1;
          tok.items.forEach(it => walk(it, { ...ctx, inU1: true, u1Arr: notesInU1, isEighthAlone: hasOnlyOneNote && it.t === 'n' }));
          if (notesInU1.length >= 2) u1Groups.push(notesInU1);
          return;
        }
        if (tok.t === 'u2') {
          const notesInU2 = [];
          tok.items.forEach(it => walk(it, { ...ctx, inU2: true, u2Arr: notesInU2 }));
          if (notesInU2.length >= 1) u2Groups.push({ notes: notesInU2, parentU1: ctx.u1Arr });
          return;
        }
        if (tok.t === 'sync') {
          tok.items.forEach(it => walk(it, ctx));
          return;
        }
        if (tok.t === 'tri') {
          const notesInTri = [];
          tok.items.forEach(it => walk(it, { ...ctx, inU1: true, u1Arr: notesInTri, triArr: notesInTri }));
          if (notesInTri.length >= 2) {
            u1Groups.push(notesInTri);
            triGroups.push(notesInTri);
          }
        }
      }

      pattern.groups.forEach(g => walk(g, { inU1: false, inU2: false, isEighthAlone: false }));

      const xStart = 58, xSpan = 232, ny = 34.5, stemTop = 14;
      const xOf = (ev) => xStart + (ev.start / 4) * xSpan + Math.min(12, ev.dur * 6);

      const lines = [24, 31, 38, 45, 52].map(y =>
        `<line x1="6" y1="${y}" x2="304" y2="${y}" stroke="#b9b2a6" stroke-width="1"/>`
      ).join('');

      const clefAndSig = `
        <text x="10" y="48" font-size="36" fill="currentColor" font-family="serif">𝄞</text>
        <text x="36" y="36" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">4</text>
        <text x="36" y="50" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">4</text>
        <line x1="6" y1="24" x2="6" y2="52" stroke="currentColor" stroke-width="1.2"/>
        <line x1="304" y1="24" x2="304" y2="52" stroke="currentColor" stroke-width="1.4"/>
      `;

      const evSvg = events.map(ev => {
        const x = xOf(ev);
        const attr = `class="s-ev" data-bar="${barIdx}" data-v="0" data-ev="${ev.idx}"`;
        if (ev.type === 'rest') {
          if (ev.dur <= 0.6) {
            return `<g ${attr}><circle cx="${x - 1.5}" cy="33" r="1.8" fill="currentColor"/><path d="M${x - 1} 34 Q${x + 2.5} 34 ${x + 3} 31 L${x - 1} 45" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
          }
          return `<g ${attr}><path d="M${x - 2} 27 L${x + 2.5} 32.5 L${x - 1.5} 37.5 L${x + 2.5} 42 Q${x - 2} 41 ${x - 1.5} 45.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
        }
        const sx = x + 4.3;
        const head = ev.hollow
          ? `<ellipse cx="${x}" cy="${ny}" rx="4.8" ry="3.3" transform="rotate(-18 ${x} ${ny})" fill="none" stroke="currentColor" stroke-width="1.8"/>`
          : `<ellipse cx="${x}" cy="${ny}" rx="4.8" ry="3.3" transform="rotate(-18 ${x} ${ny})" fill="currentColor"/>`;
        const stem = `<line x1="${sx}" y1="${ny - 1}" x2="${sx}" y2="${stemTop}" stroke="currentColor" stroke-width="1.4"/>`;
        const dot = ev.dotted ? `<circle cx="${x + 8.5}" cy="${ny - 1}" r="1.7" fill="currentColor"/>` : '';
        const flag = ev.isEighthAlone
          ? `<path d="M${sx} ${stemTop} C${sx + 6} ${stemTop + 4} ${sx + 6} ${stemTop + 10} ${sx + 2} ${stemTop + 14}" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>`
          : '';
        return `<g ${attr}>${head}${stem}${dot}${flag}</g>`;
      }).join('');

      const beams1 = u1Groups.map(grp => {
        const x1 = xOf(grp[0]) + 4.3;
        const x2 = xOf(grp[grp.length - 1]) + 4.3;
        return `<rect x="${x1 - 0.6}" y="${stemTop - 0.5}" width="${x2 - x1 + 1.2}" height="3.2" fill="currentColor"/>`;
      }).join('');

      const beams2 = u2Groups.map(({ notes, parentU1 }) => {
        if (notes.length >= 2) {
          const x1 = xOf(notes[0]) + 4.3;
          const x2 = xOf(notes[notes.length - 1]) + 4.3;
          return `<rect x="${x1 - 0.6}" y="${stemTop + 4.2}" width="${x2 - x1 + 1.2}" height="3.0" fill="currentColor"/>`;
        }
        const only = notes[0];
        const sx = xOf(only) + 4.3;
        const dir = parentU1 && parentU1[parentU1.length - 1] === only ? -1 : 1;
        const bx = dir > 0 ? sx : sx - 8;
        return `<rect x="${bx}" y="${stemTop + 4.2}" width="8" height="3.0" fill="currentColor"/>`;
      }).join('');

      const tris = triGroups.map(grp => {
        const x1 = xOf(grp[0]) - 2;
        const x2 = xOf(grp[grp.length - 1]) + 6;
        const xm = (x1 + x2) / 2;
        return `<path d="M${x1} 10 L${x1} 6 L${xm - 6} 6 M${xm + 6} 6 L${x2} 6 L${x2} 10" stroke="var(--sl-slate)" stroke-width="1.1" fill="none"/><text x="${xm}" y="9" font-size="9" font-weight="700" fill="var(--sl-slate)" text-anchor="middle">3</text>`;
      }).join('');

      return {
        html: `<svg class="staff-quiz-svg" viewBox="0 0 310 68">${lines}${clefAndSig}${evSvg}${beams1}${beams2}${tris}</svg>`,
        events: events.map(e => ({ start: e.start, dur: e.dur, type: e.type, midis: [60] })),
        barBeats: 4,
      };
    }

    function compileBuiltIn(pattern, symMode = 'staff', barIdx = 0) {
      if (symMode === 'staff') return compileBuiltInStaff(pattern, barIdx);
      return compileBuiltInJianpu(pattern, symMode, barIdx);
    }

    let audioCtx = null, playbackSession = 0, schedulerTimer = null, rafId = null, activeAudioNodes = [];
    function ensureAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function stopQuizAudio() {
      playbackSession++;
      if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      activeAudioNodes.forEach(node => { try { node.stop(); } catch {} try { node.disconnect(); } catch {} });
      activeAudioNodes = [];
      document.querySelectorAll('#beatDots .led').forEach(l => l.classList.remove('countin', 'playing'));
      document.getElementById('beatStatus').textContent = '就緒';
      document.querySelectorAll('.j-ev.active-note, .j-ev .active-note, .s-ev.active-note').forEach(el => el.classList.remove('active-note'));
      document.querySelectorAll('.playing-card').forEach(el => el.classList.remove('playing-card'));
    }
    function playQuizPattern(pat, cardEl = null, containerEl = null) {
      ensureAudioCtx(); stopQuizAudio();
      const mySession = playbackSession, bpm = Number(document.getElementById('bpmRange').value), beatSec = 60 / bpm;
      const useCountIn = document.getElementById('chkCountIn').checked, useMetro = document.getElementById('chkMetro').checked;
      const soundType = document.getElementById('soundSelect').value, symMode = document.getElementById('symbolSelect').value;
      const compiled = compileBuiltIn(pat, symMode, 0);
      const countIn = useCountIn ? 4 : 0, startTime = audioCtx.currentTime + 0.07, barStart = startTime + countIn * beatSec, totalEnd = barStart + 4 * beatSec;
      const q = [];
      for (let b = 0; b < countIn; b++) q.push({ time: startTime + b * beatSec, kind: 'metro', accent: b === 0 });
      if (useMetro) for (let b = 0; b < 4; b++) q.push({ time: barStart + b * beatSec, kind: 'metro', accent: b === 0 });
      compiled.events.forEach(ev => { if (ev.type === 'note') q.push({ time: barStart + ev.start * beatSec, durSec: ev.dur * beatSec, kind: 'note' }); });
      q.sort((a, b) => a.time - b.time);
      let idx = 0;
      const sched = () => {
        if (mySession !== playbackSession) return;
        const h = audioCtx.currentTime + 0.25;
        while (idx < q.length && q[idx].time <= h) {
          const it = q[idx++];
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          if (it.kind === 'metro') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(it.accent ? 1480 : 960, it.time);
            gain.gain.setValueAtTime(0.0001, it.time); gain.gain.linearRampToValueAtTime(it.accent ? 0.2 : 0.11, it.time + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.0001, it.time + 0.04);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(it.time); osc.stop(it.time + 0.045);
          } else {
            const d = Math.max(0.07, it.durSec * 0.9);
            osc.type = soundType === 'synth' ? 'sawtooth' : 'triangle';
            osc.frequency.setValueAtTime(soundType === 'wood' ? 780 : 261.63, it.time);
            gain.gain.setValueAtTime(0.0001, it.time); gain.gain.linearRampToValueAtTime(0.32, it.time + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, it.time + (soundType === 'wood' ? 0.085 : d));
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(it.time); osc.stop(it.time + d + 0.02);
          }
          activeAudioNodes.push(osc);
        }
      };
      sched(); schedulerTimer = setInterval(sched, 60);
      const tick = () => {
        if (mySession !== playbackSession) return;
        const now = audioCtx.currentTime;
        if (now >= totalEnd + 0.06) { stopQuizAudio(); return; }
        const leds = document.querySelectorAll('#beatDots .led');
        leds.forEach(l => l.classList.remove('countin', 'playing'));
        if (now < barStart) {
          const b = Math.floor((now - startTime) / beatSec);
          if (b >= 0 && b < leds.length) leds[b].classList.add('countin');
          document.getElementById('beatStatus').textContent = '預拍';
        } else {
          const eb = (now - barStart) / beatSec, b = Math.floor(eb);
          if (b >= 0 && b < leds.length) leds[b].classList.add('playing');
          document.getElementById('beatStatus').textContent = `第${Math.min(4, b + 1)}拍`;
          if (cardEl) cardEl.classList.add('playing-card');
          if (containerEl) {
            containerEl.querySelectorAll('.j-ev.active-note, .j-ev .active-note, .s-ev.active-note').forEach(el => el.classList.remove('active-note'));
            compiled.events.forEach((ev, evIdx) => {
              if (eb >= ev.start - 0.02 && eb < ev.start + ev.dur - 0.02) {
                const el = containerEl.querySelector(`[data-ev="${evIdx}"]`);
                if (el?.dataset?.half === '1') {
                  const sub = eb >= ev.start + 0.98 ? '.j-dash' : '.j-main';
                  el.querySelector(sub)?.classList.add('active-note');
                } else {
                  el?.classList.add('active-note');
                }
              }
            });
          }
        }
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    let selectedCats = new Set(Object.keys(CATEGORIES)), currentTab = 'analyzer', currentQuestion = null, quizLocked = false;
    let stats = { correct: 0, total: 0, streak: 0 };

    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function initCategories() {
      const bar = document.getElementById('catBar');
      Object.entries(CATEGORIES).forEach(([k, label]) => {
        const btn = document.createElement('button'); btn.className = 'cat-pill active'; btn.textContent = label;
        btn.addEventListener('click', () => {
          if (selectedCats.has(k)) { if (selectedCats.size === 1) return; selectedCats.delete(k); btn.classList.remove('active'); }
          else { selectedCats.add(k); btn.classList.add('active'); }
          renderLibrary(); generateQuestion(false);
        });
        bar.appendChild(btn);
      });
    }

    function generateQuestion(autoPlay = false) {
      stopQuizAudio(); quizLocked = false; document.getElementById('feedbackBanner').className = 'result-strip';
      const pool = PATTERNS.filter(p => selectedCats.has(p.cat)), target = pool[Math.floor(Math.random() * pool.length)];
      const seen = new Set([compileBuiltInJianpu(target, '1').html]), dist = [];
      for (const c of shuffle(pool)) { if (dist.length >= 3) break; const h = compileBuiltInJianpu(c, '1').html; if (!seen.has(h)) { seen.add(h); dist.push(c); } }
      currentQuestion = { target, options: shuffle([target, ...dist]) };
      renderQuizOptions();
      if (autoPlay) playQuizPattern(currentQuestion.target);
    }

    function renderQuizOptions() {
      if (!currentQuestion) return;
      const grid = document.getElementById('optionsGrid'), sym = document.getElementById('symbolSelect').value;
      grid.innerHTML = '';
      ['甲','乙','丙','丁'].forEach((k, i) => {
        const opt = currentQuestion.options[i], card = document.createElement('div'); card.className = 'pad';
        card.innerHTML = `<span class="pad-idx">${k}</span><div class="opt-notation" style="width:100%;display:flex;justify-content:center;">${compileBuiltIn(opt, sym).html}</div><div class="pad-meta hidden"></div>`;
        card.addEventListener('click', () => handleQuizAnswer(opt));
        grid.appendChild(card);
      });
    }

    function handleQuizAnswer(chosen) {
      if (quizLocked) return; quizLocked = true; stopQuizAudio();
      const ok = chosen.id === currentQuestion.target.id;
      stats.total++; if (ok) { stats.correct++; stats.streak++; } else { stats.streak = 0; }
      document.getElementById('statCorrect').textContent = stats.correct;
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statStreak').textContent = stats.streak;
      document.querySelectorAll('#optionsGrid .pad').forEach((card, i) => {
        card.classList.add('locked');
        const opt = currentQuestion.options[i], meta = card.querySelector('.pad-meta');
        meta.classList.remove('hidden'); meta.innerHTML = `<span>${opt.name}</span>`;
        const btn = document.createElement('button'); btn.className = 'btn btn-xs'; btn.textContent = '試聽';
        btn.addEventListener('click', (e) => { e.stopPropagation(); playQuizPattern(opt, card, card.querySelector('.opt-notation')); });
        meta.appendChild(btn);
        if (opt.id === currentQuestion.target.id) card.classList.add('correct');
        else if (opt.id === chosen.id && !ok) card.classList.add('wrong');
        else card.classList.add('dimmed');
      });
      const banner = document.getElementById('feedbackBanner'), text = document.getElementById('feedbackText');
      banner.className = ok ? 'result-strip show ok' : 'result-strip show err';
      text.textContent = ok ? `答對：${currentQuestion.target.name}` : `正解：${currentQuestion.target.name}`;
    }

    function renderLibrary() {
      const list = document.getElementById('libraryList'), sym = document.getElementById('symbolSelect').value;
      list.innerHTML = '';
      const tagClsMap = { syncopation: 'tag-sync', dotted: 'tag-dot', sixteenth: 'tag-16', offbeat: 'tag-off' };
      PATTERNS.filter(p => selectedCats.has(p.cat)).forEach(pat => {
        const card = document.createElement('div'); card.className = 'lib-card';
        card.innerHTML = `<div class="card-top"><span style="font-size:0.84rem;font-weight:700;">${pat.name}</span><span class="tag ${tagClsMap[pat.cat]||''}">${CATEGORIES[pat.cat]}</span></div><div class="lib-notation" style="display:flex;justify-content:center;">${compileBuiltIn(pat, sym).html}</div>`;
        card.addEventListener('click', () => playQuizPattern(pat, card, card.querySelector('.lib-notation')));
        list.appendChild(card);
      });
    }

    // ==========================================
    // 4. 事件綁定
    // ==========================================
    function switchTab(tabName) {
      stopQuizAudio();
      window.__dolceEngine?.stopPlayback();
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
      document.getElementById('analyzerSection').classList.toggle('hidden', tabName !== 'analyzer');
      document.getElementById('quizSection').classList.toggle('hidden', tabName !== 'quiz');
      document.getElementById('librarySection').classList.toggle('hidden', tabName !== 'library');
      document.getElementById('transportPanel').classList.toggle('hidden', tabName === 'analyzer');
      document.getElementById('beatStrip').classList.toggle('hidden', tabName === 'analyzer');
    }

    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    document.getElementById('bpmRange').addEventListener('input', (e) => document.getElementById('bpmVal').textContent = e.target.value);
    document.querySelectorAll('.toggle input').forEach(el => el.addEventListener('change', () => el.parentElement.classList.toggle('on', el.checked)));

    document.getElementById('symbolSelect').addEventListener('change', (e) => {
      try { localStorage.setItem(NOTATION_LS, e.target.value); } catch {}
      renderLibrary();
      if (!quizLocked) renderQuizOptions();
      else if (currentQuestion) {
        const sym = e.target.value;
        document.querySelectorAll('#optionsGrid .pad').forEach((c, i) => {
          c.querySelector('.opt-notation').innerHTML = compileBuiltIn(currentQuestion.options[i], sym).html;
        });
      }
    });

    document.getElementById('btnPlayQuestion').addEventListener('click', () => { if (currentQuestion) playQuizPattern(currentQuestion.target); });
    document.getElementById('btnStopAudio').addEventListener('click', stopQuizAudio);
    document.getElementById('btnLibStop').addEventListener('click', stopQuizAudio);
    document.getElementById('btnNextQuestion').addEventListener('click', () => generateQuestion(true));
    document.getElementById('btnBannerNext').addEventListener('click', () => generateQuestion(true));

    const dropzone = document.getElementById('dropzone'), scoreInput = document.getElementById('scoreInput');
    document.getElementById('omrKindSelect').addEventListener('click', (e) => e.stopPropagation());
    document.getElementById('omrKindSelect').addEventListener('change', () => {
      if (lastOmrFiles.length > 0 && lastOmrFiles.every(f => /\.(pdf|png|jpe?g|webp)$/i.test(f.name) || f.type.startsWith('image/'))) {
        void loadScoreFiles(lastOmrFiles);
      }
    });
    document.getElementById('btnRetryOmr').addEventListener('click', () => { if (lastOmrFiles.length > 0) void loadScoreFiles(lastOmrFiles); });
    document.getElementById('btnPickFile').addEventListener('click', (e) => { e.stopPropagation(); scoreInput.click(); });
    dropzone.addEventListener('click', () => scoreInput.click());
    scoreInput.addEventListener('change', (e) => { if (e.target.files?.length) handlePickedFiles(e.target.files); scoreInput.value = ''; });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if (e.dataTransfer.files?.length) handlePickedFiles(e.dataTransfer.files); });

    document.getElementById('btnConfirmOrder').addEventListener('click', () => {
      if (!pendingQueue.length) return;
      const ordered = pendingQueue.map(x => x.file);
      clearPendingQueue();
      void loadScoreFiles(ordered);
    });
    document.getElementById('btnCancelOrder').addEventListener('click', clearPendingQueue);

    // 選段反覆控制
    document.getElementById('myBtnRangeMode').addEventListener('click', () => window.__dolceEngine?.toggleRangePick());
    document.getElementById('myBtnRangeClear').addEventListener('click', () => window.__dolceEngine?.clearRangeLoop());

    // 我的最愛
    document.getElementById('myBtnFavList').addEventListener('click', async () => {
      const panel = document.getElementById('favPanel');
      const btn = document.getElementById('myBtnFavList');
      const open = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !open);
      btn.classList.toggle('fav-open', open);
      if (open) await renderFavoritesPanel();
    });
    document.getElementById('btnCloseFav').addEventListener('click', () => {
      document.getElementById('favPanel').classList.add('hidden');
      document.getElementById('myBtnFavList').classList.remove('fav-open');
    });
    document.getElementById('myBtnFavToggle').addEventListener('click', async () => {
      const snap = window.__dolceEngine?.getSnapshot();
      if (!snap) return;
      const hash = hashSnapshot(snap.format, snap.text);
      const list = await getAllFavorites();
      const existing = list.find(x => x.hash === hash);
      if (existing) {
        await deleteFavorite(existing.id);
      } else {
        await putFavorite({
          id: `fav_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          hash,
          title: snap.title,
          format: snap.format,
          text: snap.text,
          viewMode: snap.viewMode,
          createdAt: Date.now(),
        });
      }
      await syncFavToggleButton();
      if (!document.getElementById('favPanel').classList.contains('hidden')) {
        await renderFavoritesPanel();
      }
    });

    ['myViewStaff', 'myViewMixed', 'myViewExpanded'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => setTimeout(() => void syncFavToggleButton(), 150));
    });

    document.getElementById('myBtnZoomIn').addEventListener('click', () => window.__dolceEngine?.zoomBy(1.2));
    document.getElementById('myBtnZoomOut').addEventListener('click', () => window.__dolceEngine?.zoomBy(1 / 1.2));
    document.getElementById('myBtnZoomReset').addEventListener('click', () => window.__dolceEngine?.resetZoom());
    document.getElementById('myBtnPrevPage').addEventListener('click', () => window.__dolceEngine?.prevPage());
    document.getElementById('myBtnNextPage').addEventListener('click', () => window.__dolceEngine?.nextPage());

    document.getElementById('myBtnExportXml').addEventListener('click', async () => {
      const xml = await window.__dolceEngine?.exportXml();
      if (!xml) return;
      const blob = new Blob([xml], { type: 'application/vnd.recordare.musicxml+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'score.musicxml';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    initCategories();
    renderLibrary();
    generateQuestion(false);
    // 立即啟動引擎與模型預載，移除 300ms 延遲以加快手機端就緒速度
    void ensureDolceEngine();
  </script>
